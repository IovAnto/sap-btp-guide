<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABAP Data Dictionary — Manuale Tecnico</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%200%20100%20100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23212529%22/><text y=%2265%22 x=%2214%22 font-size=%2250%22 fill=%22white%22 font-family=%22monospace%22>SAP</text></svg>">
</head>
<body>

  <div class="layout">
    
    <!-- Sidebar: Table of Contents (TOC Tree) -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="../index.html" style="display: inline-flex; align-items: center; gap: 4px; font-size: 0.72rem; color: var(--accent); text-decoration: none; font-weight: 600; margin-bottom: 8px; font-family: var(--font-mono);">← Hub Manuali</a>
        <h1>ABAP Data Dictionary</h1>
        <p>Manuale Tecnico & Modello Dati</p>
      </div>

      <div class="sidebar-search">
        <input type="text" id="search-input" placeholder="Cerca tabella o campo (es. FKDAT, F2)..." autocomplete="off" spellcheck="false">
        <span class="search-shortcut-hint">/</span>
      </div>

      <nav class="sidebar-nav" id="toc-nav">
        <!-- Rendered dynamically via JavaScript -->
      </nav>

      <div class="sidebar-footer">
        <span id="footer-count">16 Tabelle DDIC</span>
        <button class="btn-toggle-theme" id="theme-btn">Tema: Dark</button>
      </div>
    </aside>

    <!-- Reading Scroll Area: Complete Continuous Technical Manual -->
    <main class="reading-scroll" id="reading-scroll">
      <article class="manual-container" id="manual-container">
        <!-- Dynamically rendered Table Manual Chapter -->
      </article>
    </main>

  </div>

  <!-- Inspector Modal (Data Element, Domain & Where-Used Cross Reference) -->
  <div class="inspector-overlay hidden" id="inspector-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="inspector-card">
      <div class="inspector-header">
        <div class="inspector-badge" id="modal-badge">[DATA ELEMENT]</div>
        <h2 class="inspector-title" id="modal-title">NOME_ELEMENTO</h2>
        <button class="btn-modal-close" id="modal-close-btn" title="Chiudi (Esc)">✕</button>
      </div>
      <div class="inspector-body" id="modal-body">
        <!-- Injected via JavaScript -->
      </div>
    </div>
  </div>

  <!-- Offline-safe dataset + manual controller script -->
  <script src="data/tables.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
