<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABAP Data Dictionary — Documentazione Tecnica & Esempi</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%200%20100%20100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
</head>
<body>

    <div class="layout">
        
        <!-- Minimal Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>ABAP Data Dictionary</h1>
                <p>Tree View Reference & Esempi Reali</p>
            </div>

            <div class="sidebar-search">
                <input type="text" id="search-input" placeholder="Cerca tabella o campo (es. FKDAT, FKART)..." autocomplete="off" spellcheck="false">
            </div>

            <nav class="sidebar-nav" id="sidebar-nav">
                <!-- Dynamically populated by app.js -->
            </nav>

            <div class="sidebar-footer">
                <span id="footer-count">16 Tabelle DDIC</span>
                <button class="theme-toggle-btn" id="theme-btn">Tema: Dark</button>
            </div>
        </aside>

        <!-- Reading Scroll Area -->
        <main class="reading-scroll">
            <div class="doc-container" id="doc-container">
                <!-- Dynamically rendered table documentation -->
            </div>
        </main>

    </div>

    <!-- Offline-safe pre-bundled dataset + controller script -->
    <script src="data/tables.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
