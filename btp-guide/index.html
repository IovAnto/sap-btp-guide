<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAP BTP Master Guide — Documentazione Tecnica</title>
    <style>
        :root {
            --bg-page: #0f1117;
            --bg-sidebar: #0b0d13;
            --bg-surface: #161922;
            --bg-surface-hover: #1e2230;
            --border-color: #232736;
            --text-title: #f3f4f6;
            --text-main: #d1d5db;
            --text-muted: #8b92a5;
            --accent: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --code-bg: #131620;
            --sidebar-width: 290px;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        }

        [data-theme="light"] {
            --bg-page: #ffffff;
            --bg-sidebar: #f8fafc;
            --bg-surface: #f1f5f9;
            --bg-surface-hover: #e2e8f0;
            --border-color: #e2e8f0;
            --text-title: #0f172a;
            --text-main: #334155;
            --text-muted: #64748b;
            --accent: #0070d2;
            --accent-green: #059669;
            --accent-red: #dc2626;
            --code-bg: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-page);
            color: var(--text-main);
            line-height: 1.7;
            font-size: 16px;
            overflow-x: hidden;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* Minimal Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            height: 100vh;
            position: sticky;
            top: 0;
            display: flex;
            flex-direction: column;
            z-index: 50;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 20px 20px 16px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-hub-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.72rem;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 8px;
            font-family: var(--font-mono);
            transition: opacity 0.15s;
        }

        .nav-hub-link:hover {
            text-decoration: underline;
        }

        .sidebar-header h1 {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-title);
            letter-spacing: -0.01em;
        }

        .sidebar-header p {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .sidebar-search {
            padding: 12px 18px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-search input {
            width: 100%;
            background: var(--bg-page);
            border: 1px solid var(--border-color);
            color: var(--text-title);
            font-size: 0.8rem;
            padding: 6px 10px;
            border-radius: 4px;
            outline: none;
        }

        .sidebar-search input:focus {
            border-color: var(--accent);
        }

        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: 14px 12px;
        }

        .nav-group-title {
            font-size: 0.68rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            padding: 12px 10px 4px 10px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 10px;
            border-radius: 4px;
            font-size: 0.82rem;
            color: var(--text-main);
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 1px;
            transition: background 0.1s;
        }

        .nav-item:hover {
            background-color: var(--bg-surface-hover);
            color: var(--text-title);
        }

        .nav-item.active {
            background-color: var(--bg-surface);
            color: var(--accent);
            font-weight: 600;
        }

        .nav-item-num {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            opacity: 0.7;
            margin-right: 8px;
        }

        .nav-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--border-color);
            flex-shrink: 0;
        }

        .nav-dot.done {
            background-color: var(--accent-green);
        }

        .nav-dot.in-prog {
            background-color: var(--accent);
        }

        .sidebar-footer {
            padding: 14px 18px;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .theme-toggle-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.72rem;
        }

        .theme-toggle-btn:hover {
            color: var(--text-title);
            border-color: var(--text-muted);
        }

        /* Reading Area (Max Width ~800px for optimal reading) */
        .reading-scroll {
            flex: 1;
            height: 100vh;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .doc-container {
            max-width: 820px;
            margin: 0 auto;
            padding: 48px 36px 120px 36px;
        }

        /* Document Header */
        .doc-header {
            margin-bottom: 40px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .doc-part {
            font-size: 0.78rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .doc-title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-title);
            line-height: 1.25;
            letter-spacing: -0.02em;
            margin-bottom: 14px;
        }

        .doc-meta {
            font-size: 0.84rem;
            color: var(--text-muted);
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        /* In-Page Navigation */
        .doc-nav-strip {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 36px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.8rem;
        }

        .doc-nav-link {
            color: var(--text-muted);
            text-decoration: none;
            white-space: nowrap;
            padding: 3px 6px;
            border-radius: 3px;
        }

        .doc-nav-link:hover {
            color: var(--text-title);
            background: var(--bg-surface);
        }

        /* Headings */
        .doc-section-h2 {
            font-size: 1.28rem;
            font-weight: 700;
            color: var(--text-title);
            margin: 44px 0 16px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            letter-spacing: -0.01em;
        }

        .doc-topic-h3 {
            font-size: 1.08rem;
            font-weight: 600;
            color: var(--text-title);
            margin: 30px 0 10px 0;
        }

        /* Paragraphs and Lists */
        .doc-p {
            font-size: 0.98rem;
            color: var(--text-main);
            margin-bottom: 16px;
            line-height: 1.72;
        }

        .doc-p strong {
            color: var(--text-title);
            font-weight: 600;
        }

        .doc-list, .doc-steps {
            margin: 10px 0 18px 24px;
            font-size: 0.96rem;
            color: var(--text-main);
        }

        .doc-list li, .doc-steps li {
            margin-bottom: 8px;
            line-height: 1.65;
        }

        .doc-list li strong, .doc-steps li strong {
            color: var(--text-title);
        }

        .doc-code {
            font-family: var(--font-mono);
            font-size: 0.85em;
            background: var(--code-bg);
            border: 1px solid var(--border-color);
            padding: 1px 5px;
            border-radius: 3px;
            color: var(--accent);
        }

        .doc-quote {
            border-left: 3px solid var(--accent);
            background-color: var(--bg-surface);
            padding: 12px 18px;
            margin: 18px 0;
            font-size: 0.92rem;
            color: var(--text-main);
        }

        .doc-quote strong {
            color: var(--text-title);
        }

        /* Minimal Technical Figures */
        .doc-figures-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 20px;
            margin: 20px 0 36px 0;
        }

        .doc-figure {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            background: var(--bg-surface);
            cursor: pointer;
            transition: border-color 0.15s;
        }

        .doc-figure:hover {
            border-color: var(--accent);
        }

        .doc-fig-img {
            width: 100%;
            height: 180px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }

        .doc-fig-img img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .doc-fig-caption {
            padding: 12px 14px;
            border-top: 1px solid var(--border-color);
        }

        .doc-fig-label {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            display: block;
            margin-bottom: 2px;
        }

        .doc-fig-title {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-title);
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .doc-fig-desc {
            font-size: 0.78rem;
            color: var(--text-muted);
            line-height: 1.45;
        }

        /* Minimal Monospace Blueprint */
        .doc-blueprint-box {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            line-height: 1.45;
            background: var(--code-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            overflow-x: auto;
            color: var(--text-title);
            margin: 16px 0 36px 0;
        }

        /* Minimal Glossary List */
        .doc-glossary {
            margin: 16px 0 36px 0;
        }

        .doc-glossary-item {
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .doc-glossary-term {
            font-weight: 700;
            color: var(--text-title);
            font-size: 0.94rem;
            margin-bottom: 3px;
        }

        .doc-glossary-def {
            font-size: 0.9rem;
            color: var(--text-main);
            line-height: 1.55;
        }

        /* Minimal Best Practices */
        .doc-bp-item {
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .doc-bp-badge {
            font-family: var(--font-mono);
            font-size: 0.68rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 3px;
            text-transform: uppercase;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .badge-critico {
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
        }

        .badge-alto {
            color: #f59e0b;
            border: 1px solid #f59e0b;
        }

        .badge-medio {
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }

        .doc-bp-rule {
            font-weight: 600;
            color: var(--text-title);
            font-size: 0.92rem;
            margin-bottom: 2px;
        }

        .doc-bp-reason {
            font-size: 0.86rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* Minimal Quiz */
        .doc-quiz-block {
            margin: 20px 0;
        }

        .doc-quiz-item {
            padding: 20px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .doc-quiz-num {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .doc-quiz-q {
            font-size: 0.98rem;
            font-weight: 600;
            color: var(--text-title);
            margin-bottom: 14px;
            line-height: 1.5;
        }

        .doc-quiz-opts {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .doc-quiz-btn {
            width: 100%;
            text-align: left;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.1s;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            line-height: 1.45;
        }

        .doc-quiz-btn:hover:not(:disabled) {
            background-color: var(--bg-surface-hover);
            color: var(--text-title);
        }

        .doc-quiz-btn.correct {
            background-color: rgba(16, 185, 129, 0.12) !important;
            border-color: var(--accent-green) !important;
            color: var(--accent-green) !important;
            font-weight: 600;
        }

        .doc-quiz-btn.wrong {
            background-color: rgba(239, 68, 68, 0.12) !important;
            border-color: var(--accent-red) !important;
            color: var(--accent-red) !important;
        }

        .doc-quiz-letter {
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 0.75rem;
            opacity: 0.75;
            padding: 1px 4px;
            border: 1px solid var(--border-color);
            border-radius: 2px;
            flex-shrink: 0;
        }

        .doc-quiz-exp {
            margin-top: 12px;
            padding: 12px 14px;
            background: var(--bg-surface);
            border-left: 2px solid var(--accent);
            font-size: 0.86rem;
            color: var(--text-main);
            display: none;
            line-height: 1.5;
        }

        .doc-quiz-exp.show {
            display: block;
        }

        .doc-quiz-exp strong {
            color: var(--text-title);
        }

        .doc-quiz-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            padding-top: 16px;
        }

        .doc-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 4px;
            font-size: 0.86rem;
            font-weight: 600;
            cursor: pointer;
        }

        .doc-btn-subtle {
            background: none;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 0.86rem;
            cursor: pointer;
        }

        .doc-btn-subtle:hover {
            color: var(--text-title);
            border-color: var(--text-muted);
        }

        /* Lightbox */
        .lightbox-overlay {
            display: none;
            position: fixed;
            z-index: 100;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .lightbox-overlay.active {
            display: flex;
        }

        .lightbox-modal {
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .lightbox-modal img {
            max-width: 100%;
            max-height: 75vh;
            object-fit: contain;
            border-radius: 4px;
        }

        .lightbox-cap {
            margin-top: 10px;
            color: #fff;
            text-align: center;
            max-width: 700px;
            font-size: 0.85rem;
        }

        .lightbox-close-btn {
            position: absolute;
            top: -30px;
            right: 0;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.6rem;
            cursor: pointer;
        }

        @media (max-width: 860px) {
            .sidebar {
                position: fixed;
                transform: translateX(-100%);
            }
            .sidebar.mobile-open {
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
    <div class="layout">
        <!-- Minimal Left Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="../index.html" class="nav-hub-link">← Hub Manuali</a>
                <h1>SAP BTP Master Guide</h1>
                <p>Manuale di Riferimento & Certificazione</p>
            </div>
            <div class="sidebar-search">
                <input type="text" placeholder="Filtra capitoli..." oninput="onFilter(this.value)">
            </div>
            <nav class="sidebar-nav" id="sidebar-nav">
                <!-- Nav items generated via JS -->
            </nav>
            <div class="sidebar-footer">
                <span id="stat-progress">0/18 completati</span>
                <button class="theme-toggle-btn" onclick="toggleTheme()">Tema</button>
            </div>
        </aside>

        <!-- Document Content -->
        <main class="reading-scroll">
            <div class="doc-container" id="doc-render-area">
                <!-- Dynamic Chapter Content -->
            </div>
        </main>
    </div>

    <!-- Lightbox Modal -->
    <div class="lightbox-overlay" id="lightbox" onclick="closeLightbox()">
        <div class="lightbox-modal" onclick="event.stopPropagation()">
            <button class="lightbox-close-btn" onclick="closeLightbox()">&times;</button>
            <img id="lb-img" src="" alt="Enlarged figure">
            <div class="lightbox-cap">
                <strong id="lb-title"></strong>
                <p id="lb-desc" style="color: #cbd5e1; margin-top: 4px;"></p>
            </div>
        </div>
    </div>

    <script>
        const CHAPTERS = [{"id": 1, "number": "01", "title": "Introduction: Digital Transformation & The Intelligent Enterprise", "shortTitle": "Introduction", "part": "Part I: Getting Started", "readingTime": "25 min", "roles": ["Enterprise Architect", "SAP Functional/Technical Consultant", "Solution Architect", "IT Manager"], "cleanSummaryHtml": "<p class=\"doc-p\">Il Capitolo 1 definisce la ragion d'essere di <strong>SAP Business Technology Platform (SAP BTP)</strong> nel contesto economico e tecnologico moderno. Per decenni le aziende tradizionali (<em>Digital Immigrants</em>) hanno dominato i mercati digitalizzando processi esistenti, ma oggi sono minacciate da aziende nate nel cloud (<em>Digital Natives</em>, come Netflix, Uber, Amazon) che sfruttano architetture agili, scalabili e basate su dati in tempo reale.</p>\n<p class=\"doc-p\">SAP BTP non è semplicemente una \"nuova tecnologia\", ma la <strong>fondazione architetturale multicloud</strong> che consente la transizione da un modello IT monolitico e rigido verso l'<strong>Intelligent Enterprise</strong>. BTP permette di implementare il paradigma del <strong>Bimodal IT</strong>: salvaguardare la stabilità e la conformità delle applicazioni core mission-critical (<strong>Mode 1</strong>) abilitando parallelamente una rapidissima capacità di innovazione, estensione e prototipazione (<strong>Mode 2</strong>). Il capitolo introduce la combinazione vincente tra <strong>O-Data</strong> (dati operativi) e <strong>X-Data</strong> (dati di esperienza), i <strong>quattro pilastri tecnologici di SAP BTP</strong> e il principio fondamentale del mantenimento del <strong>Clean Core</strong>.</p>", "figures": [{"figNumber": "Figura 1.1", "title": "Connessione continua tra X-Data e O-Data nell'Intelligent Enterprise", "image": "images/01_001.png", "explanation": "Illustra come SAP BTP funga da tessuto connettivo tra i dati di esperienza (X-Data: sentiment, feedback cliente da Qualtrics) e i dati operativi transazionali (O-Data: ordini, fatture da SAP S/4HANA), chiudendo il ciclo decisionale in tempo reale."}, {"figNumber": "Figura 1.3", "title": "I 4 Pilastri Tecnologici Fondamentali di SAP BTP", "image": "images/01_003.png", "explanation": "Rappresenta l'architettura a quattro pilastri della piattaforma: Database and Data Management (SAP HANA Cloud), Analytics (SAP Analytics Cloud), Application Development and Integration (Extension Suite & Integration Suite), e Intelligent Technologies (AI/ML & RPA)."}, {"figNumber": "Figura 1.8", "title": "Integrazione, Estensione e Valorizzazione dei Dati nei Paesaggi SAP", "image": "images/01_008.png", "explanation": "Mappa visiva che dimostra la strategia Clean Core: mantenere i sistemi ERP standard intatti ed eseguire integrazioni ed estensioni differenzianti all'esterno su SAP BTP."}, {"figNumber": "Figura 1.9", "title": "Architettura di SAP HANA Cloud e Tiering di Memorizzazione", "image": "images/01_009.png", "explanation": "Dettaglio dell'Index Server di SAP HANA Cloud con memorizzazione ibrida a colonne, query optimizer ed elaborazione vettoriale in-memory multi-modello."}], "architectureDiagram": "\n┌────────────────────────────────────────────────────────────────────────────────────────┐\n│                              THE INTELLIGENT ENTERPRISE                                │\n├───────────────────────────────────────────┬────────────────────────────────────────────┤\n│           INTELLIGENT SUITE               │            EXPERIENCE MANAGEMENT           │\n│  S/4HANA • SuccessFactors • Ariba         │       Qualtrics (Customer, Employee,       │\n│  Concur • SAP Customer Experience (CX)    │            Product, Brand Pulse)           │\n│             [ O-DATA: COSA ACCADE ]       │           [ X-DATA: PERCHÉ ACCADE ]        │\n├───────────────────────────────────────────┴────────────────────────────────────────────┤\n│                         INDUSTRY CLOUD & BUSINESS NETWORKS                             │\n│       Ariba Network • Logistics Business Network • One Domain Model Verticals          │\n├────────────────────────────────────────────────────────────────────────────────────────┤\n│                       SAP BUSINESS TECHNOLOGY PLATFORM (SAP BTP)                       │\n│  ┌───────────────────────────────┬───────────────────────────────┐                     │\n│  │ DATABASE & DATA MANAGEMENT    │ ANALYTICS                     │                     │\n│  │ SAP HANA Cloud • Data Intel.  │ SAP Analytics Cloud (SAC)     │                     │\n│  │ Master Data Gov. • SAP ASE/IQ │ Data Warehouse Cloud          │                     │\n│  ├───────────────────────────────┼───────────────────────────────┤                     │\n│  │ APP DEVELOPMENT & INTEGRATION │ INTELLIGENT TECHNOLOGIES      │                     │\n│  │ Integration Suite • Kyma • CF │ SAP AI Core • AI Launchpad    │                     │\n│  │ Extension Suite • BAS • ABAP  │ Process Automation • IoT      │                     │\n│  └───────────────────────────────┴───────────────────────────────┘                     │\n├────────────────────────────────────────────────────────────────────────────────────────┤\n│             HYPERSCALERS & MULTICLOUD (AWS • Microsoft Azure • GCP • Alibaba)          │\n└────────────────────────────────────────────────────────────────────────────────────────┘\n    ", "coreTopics": [{"title": "1. Evoluzione Digitale: Digitization vs Digitalization vs Digital Transformation", "cleanHtml": "<p class=\"doc-p\">Nel lavoro quotidiano di consulenza e architettura, confondere questi tre termini è un errore critico:</p>\n<ul class=\"doc-list\">\n<li><strong>Digitization (Digitalizzazione dell'informazione)</strong>: La conversione pura da analogico/cartaceo a formato digitale (es. passare da fatture cartacee a PDF/documenti scansionati, schede anagrafiche su file). Non altera il processo.</li>\n<li><strong>Digitalization (Digitalizzazione del processo)</strong>: L'utilizzo di software e computer per automatizzare e velocizzare un processo di lavoro esistente, lasciando immutata la logica di fondo (es. form digitale per inserire ordini anziché inviarli via fax; la velocità aumenta ma il modello di business è identico).</li>\n<li><strong>Digital Transformation (Trasformazione Digitale)</strong>: Riprogettazione radicale del modello di business abilitata dalla tecnologia (es. Netflix che passa da spedizione di DVD a piattaforma di streaming on-demand con recommendation engine basato su AI; vendita di prodotti fisici trasformata in abbonamento <em>as-a-Service</em> con IoT e manutenzione predittiva).</li>\n</ul>"}, {"title": "2. Digital Natives vs Digital Immigrants e la sfida della 'Grocer'", "cleanHtml": "<p class=\"doc-p\">Il libro propone il caso paradigmatico di <strong>Grocer</strong>, azienda multinazionale della grande distribuzione attiva da oltre 90 anni. Grocer ha affrontato con successo la digitalizzazione iniziale, ma rischia l'obsolescenza ('Digital Dinosaur') di fronte ai <em>Digital Natives</em>:</p>\n<ul class=\"doc-list\">\n<li><strong>Digital Natives</strong>: Aziende nate nell'era internet/cloud che partono da un <em>foglio bianco (blank slate)</em>, prive di debito tecnico o sistemi legacy on-premise, pensate nativamente per utenti mobili connessi 24/7.</li>\n<li><strong>Digital Immigrants</strong>: Grandi colossi industriali e di servizi con decenni di investimenti in sistemi ERP on-premise complessi e mission-critical. Non possono permettersi di 'buttare via tutto' per ripartire da zero.</li>\n<li><strong>La soluzione</strong>: SAP BTP funge da <strong>ponte strategico</strong> tra il solido patrimonio applicativo esistente e la rapida frontiera dell'innovazione.</li>\n</ul>"}, {"title": "3. Bimodal IT applicato all'Ecosistema SAP", "cleanHtml": "<p class=\"doc-p\">Formulato da Gartner e adattato alla strategia SAP:</p>\n<ul class=\"doc-list\">\n<li><strong>Mode 1 (Stabilità & Resilienza - 'Keep the lights on')</strong>: Focalizzato su processi stabili, prevedibili, altamente regolamentati (Core ERP S/4HANA, contabilità generale, gestione stipendi, catena logistica). La priorità è zero downtime, accuratezza dei dati e conformità.</li>\n<li><strong>Mode 2 (Agilità & Innovazione - 'Exploration & Speed')</strong>: Focalizzato su velocità di rilascio, time-to-market, consumer-grade experience, sperimentazione di AI/ML, app mobile per clienti e integrazione con partner esterni.</li>\n</ul>\n<p class=\"doc-p\">SAP BTP è il runtime ideale per il <strong>Mode 2</strong>, collegato al <strong>Mode 1</strong> attraverso connettori sicuri (SAP Cloud Connector) e API gestite, garantendo l'isolamento del Core applicativo (<strong>Clean Core Paradigm</strong>).</p>"}, {"title": "4. La convergenza vincente: O-Data + X-Data", "cleanHtml": "<p class=\"doc-p\">Un'organizzazione intelligente non può guidare le proprie decisioni guardando solo ai dati contabili e logistici:</p>\n<ul class=\"doc-list\">\n<li><strong>O-Data (Operational Data)</strong>: Generati da ERP, CRM, SCM, HR (fatturato mensile, tasso di rotazione magazzino, resi prodotto, tempo medio di spedizione). L'O-Data dice <strong>COSA</strong> è accaduto.</li>\n<li><strong>X-Data (Experience Data)</strong>: Catturati tramite soluzioni come <strong>Qualtrics</strong> sui quattro momenti di esperienza (Customer Experience, Employee Experience, Product Experience, Brand Experience). Rilevano emozioni, percezioni, aspettative e motivazioni d'acquisto. L'X-Data spiega il <strong>PERCHÉ</strong> è accaduto.</li>\n<li><strong>Il valore per il business</strong>: Se l'O-Data mostra un calo delle vendite in una filiale, l'X-Data rivela che i clienti sono frustrati dai tempi di cassa o che i dipendenti sono demotivati. Collegando X-Data e O-Data su SAP BTP, l'azienda attiva <strong>workflow correttivi automatici</strong> (es. alert, re-routing del personale, promozioni personalizzate).</li>\n</ul>"}, {"title": "5. I Quattro Pilastri Tecnologici di SAP BTP", "cleanHtml": "<p class=\"doc-p\">SAP BTP struttura i suoi servizi attorno a quattro grandi aree:</p>\n<ol class=\"doc-steps\">\n<li><strong>Database & Data Management</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li><em>SAP HANA / SAP HANA Cloud</em>: Database relazionale in-memory, colonnare, multi-modello (elabora grafi, testo, geospaziale e machine learning direttamente in engine).</li>\n<li><em>SAP Data Intelligence</em>: Gestione di data pipeline eterogenee, data orchestration, catalogazione e governance su landscape complessi (cloud + on-premise + data lake).</li>\n<li><em>SAP Master Data Governance (MDG)</em>: Standardizzazione del dato anagrafico unico (Golden Record).</li>\n<li><em>SAP ASE (Sybase) & SAP IQ</em>: Rispettivamente per transazioni OLTP ad alto volume e archiviazione dati analitici su scala petabyte.</li>\n</ul>\n<ol class=\"doc-steps\">\n<li><strong>Analytics</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li><em>SAP Analytics Cloud (SAC)</em>: Soluzione unificata di Business Intelligence (BI), Augmented Analytics (Smart Insights, Search to Insight guidati da AI) ed Enterprise Planning/Budgeting.</li>\n<li><em>SAP Data Warehouse Cloud (ora Datasphere)</em>: Creazione di data layer semantici aziendali senza duplicare fisicamente i dati (Data Federation).</li>\n<li><em>SAP BusinessObjects</em>: Piattaforma tradizionale di reporting enterprise on-premise.</li>\n</ul>\n<ol class=\"doc-steps\">\n<li><strong>Application Development & Integration</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li><em>SAP Integration Suite</em>: Cloud Integration (CPI), API Management (esposizione, sicurezza e monetizzazione API), Open Connectors (160+ connettori preconfigurati a SaaS terzi come Salesforce, ServiceNow, Workday), Integration Advisor (mapping guidato da Machine Learning), Event Mesh.</li>\n<li><em>SAP Extension Suite</em>: Sviluppo pro-code e low-code (Business Application Studio, SAPUI5, SAP Fiori Elements, AppGyver/Build Apps), Mobile Services e Digital Workplace (SAP Work Zone, Launchpad).</li>\n</ul>\n<ol class=\"doc-steps\">\n<li><strong>Intelligent Technologies</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li><em>SAP AI Core & SAP AI Launchpad</em>: Esecuzione scalabile e monitoraggio di modelli AI/ML multitenant integrati con le app SAP.</li>\n<li><em>SAP Intelligent RPA (Process Automation)</em>: Bot software per l'automazione di compiti ripetitivi su UI e backend.</li>\n<li><em>SAP Internet of Things (IoT)</em>: Ingestion ed elaborazione telemetrie da macchinari industriali e sensori.</li>\n</ul>"}, {"title": "6. I Tre Destinatari Chiave di SAP BTP", "cleanHtml": "<ul class=\"doc-list\">\n<li><strong>Developers</strong>: Dispongono di strumenti moderni e standard di mercato (Node.js, Java, ABAP Cloud, Python), ambienti serverless (Kyma/Kubernetes e Cloud Foundry), e il Cloud Application Programming Model (CAP) che astrae la complessità dei servizi sottostanti.</li>\n<li><strong>Partners</strong>: Possono costruire pacchetti applicativi IP (Intellectual Property) commerciali scalabili e multitenant da distribuire e monetizzare su SAP Store con zero attrito di deployment.</li>\n<li><strong>Customers</strong>: Evitano il vendor lock-in infrastrutturale (grazie al supporto multicloud AWS, Azure, GCP), preservano la stabilità del core ERP aziendale ed evitano costose re-implementazioni durante gli upgrade.</li>\n</ul>"}], "keyDefinitions": [{"term": "SAP Business Technology Platform (SAP BTP)", "definition": "Piattaforma tecnologica enterprise unificata e aperta basata su cloud (multicloud), che raggruppa funzionalità di gestione dati, analytics, sviluppo applicativo, integrazione e intelligenza artificiale per supportare l'Intelligent Enterprise e la transizione al Clean Core."}, {"term": "Clean Core Strategy", "definition": "Principio architetturale fondamentale che vieta modifiche invasive dirette (modifiche al codice standard o tabelle custom nel core ERP come S/4HANA). Tutte le personalizzazioni e logiche estese vengono realizzate su SAP BTP ('Side-by-Side Extensibility'), garantendo upgrade continui e senza blocchi del sistema centrale."}, {"term": "Bimodal IT", "definition": "Framework gestionale (Gartner) che articola l'IT in due modalità sinergiche: Mode 1 (focalizzato su stabilità, prevedibilità, conformità e mantenimento dei sistemi core) e Mode 2 (focalizzato su velocità, agilità, prototipazione rapida ed esplorazione di nuove soluzioni su cloud)."}, {"term": "O-Data (Operational Data)", "definition": "Dati transazionali strutturati che descrivono COSA succede nelle attività aziendali quotidiane (ordini di vendita, inventario, costi, contabilità, logistica), tipicamente conservati ed elaborati all'interno di sistemi ERP e CRM."}, {"term": "X-Data (Experience Data)", "definition": "Dati qualitativi e attitudinali che spiegano il PERCHÉ le cose accadono, catturando sentimenti, percezioni, aspettative e opinioni di clienti, dipendenti, fornitori e partner attraverso piattaforme di experience management (es. Qualtrics)."}, {"term": "Digital Natives vs Digital Immigrants", "definition": "I Digital Natives sono imprese nate con internet e il cloud (architettura elastica, orientata ai dati, senza legacy). I Digital Immigrants sono imprese consolidate con una storia decennale che gestiscono processi complessi su sistemi legacy e devono modernizzarsi salvaguardando il proprio patrimonio applicativo."}, {"term": "SAP Integration Suite", "definition": "Soluzione di integrazione enterprise come servizio (iPaaS) all'interno di BTP che consente di collegare applicazioni, processi e dati distribuiti tra ambienti on-premise, cloud SAP e sistemi eterogenei non-SAP (include Cloud Integration, API Management, Open Connectors, Event Mesh)."}, {"term": "SAP Extension Suite", "definition": "Insieme di strumenti, linguaggi di programmazione, servizi e framework di SAP BTP che consentono di creare estensioni applicative (sia Low-Code/No-Code sia Pro-Code) per arricchire le soluzioni standard SAP senza intaccare il codice del sistema sorgente."}, {"term": "Industry Cloud", "definition": "Insieme di soluzioni verticali specializzate per settore industriale (es. Automotive, Retail, Life Sciences), sviluppate da SAP e partner sopra SAP BTP utilizzando il SAP One Domain Model per integrarsi nativamente con l'Intelligent Suite."}, {"term": "Data-to-Value", "definition": "Capacità strategica di raccogliere, orchestrare, arricchire e analizzare grandi moli di dati eterogenei per trasformarli in azioni di business tempestive e informate tramite strumenti di analytics e machine learning integrati in BTP."}], "workplaceBestPractices": [{"riskLevel": "CRITICO", "rule": "In ogni nuovo progetto di estensione o integrazione SAP, verifica sempre l'adozione della strategia Clean Core", "reason": "chiediti 'Posso realizzare questa funzionalità side-by-side su SAP BTP anziché con una modifica Z nel sistema S/4HANA?'"}, {"riskLevel": "ALTO", "rule": "Non limitare le decisioni architetturali ai soli dati dell'ERP (O-Data)", "reason": "progetta sistemi capaci di ascoltare i segnali dell'esperienza (X-Data) per abilitare azioni preventive e workflow automatici."}, {"riskLevel": "ALTO", "rule": "Comunica con gli stakeholder usando la corretta distinzione tra Digitization, Digitalization e Digital Transformation", "reason": "aiuta il management a comprendere che BTP non serve a convertire un modulo cartaceo in un form web, ma a generare nuovi modelli di ricavo e agilità."}, {"riskLevel": "MEDIO", "rule": "Evita integrazioni point-to-point (P2P) artigianali tra cloud e sistemi on-premise", "reason": "sfrutta SAP Integration Suite e SAP Cloud Connector per garantire tracciabilità, sicurezza di livello enterprise e scalabilità."}, {"riskLevel": "MEDIO", "rule": "Applica con rigore il principio del Clean Core", "reason": "ogni volta che ti viene richiesta una customizzazione su S/4HANA, valuta per prima cosa la fattibilità con side-by-side extensibility su SAP BTP prima di considerare modifiche in-app."}, {"riskLevel": "CRITICO", "rule": "Definisci sin dall'avvio del progetto una matrice chiara di governance tra dati operativi (O-Data) e dati di esperienza (X-Data), per evitare silos analitici tra il team ERP e i team di business/marketing.", "reason": "Standard architetturale raccomandato da SAP per la stabilità e la sicurezza operativa."}], "quiz": [{"id": 1, "question": "Qual è la differenza fondamentale tra 'Digitalization' e 'Digital Transformation' secondo quanto esposto nel Capitolo 1?", "options": ["La Digitalization riguarda il passaggio da carta a file binari, mentre la Digital Transformation riguarda esclusivamente l'acquisto di licenze cloud.", "La Digitalization automatizza e velocizza un processo di business esistente tramite computer senza cambiarne la sostanza, mentre la Digital Transformation reinventa i processi e i modelli di business sfruttando la tecnologia moderna.", "La Digitalization si applica unicamente ai database on-premise, mentre la Digital Transformation si riferisce all'uso di linguaggi di programmazione moderni come Python o JavaScript.", "Non vi è alcuna differenza sostanziale; i due termini sono sinonimi intercambiabili introdotti dal marketing SAP."], "correctIndex": 1, "explanation": "La Digitalization fa cose vecchie in modo più efficiente tramite il computer (es. foglio di calcolo invece di registro contabile), mentre la Digital Transformation riprogetta da zero il modello operativo e di business (es. Netflix che passa dalla spedizione fisica di DVD allo streaming intelligente guidato da AI)."}, {"id": 2, "question": "Nel concetto di 'Bimodal IT' teorizzato da Gartner e applicato al mondo SAP, quale ruolo ricopre il 'Mode 1'?", "options": ["Guidare la prototipazione rapida di app mobili e la sperimentazione di algoritmi di Machine Learning.", "Mantenere i sistemi core stabili, conformi e pienamente operativi ('keep the lights on'), gestendo le transazioni mission-critical in modo prevedibile e sicuro.", "Sostituire completamente l'ERP aziendale con microservizi distribuiti su Kubernetes.", "Gestire le campagne di marketing e i feedback NPS raccolti dagli utenti sui social media."], "correctIndex": 1, "explanation": "Il Mode 1 è deputato alla stabilità, resilienza e continuità operativa dei sistemi di record core (come l'ERP contabile/produttivo), mentre il Mode 2 è deputato all'agilità, esplorazione e innovazione rapida."}, {"id": 3, "question": "Un'azienda manifatturiera registra nei propri report SAP S/4HANA un tasso di reso dei prodotti del 18% nell'ultimo trimestre. Questo dato è un tipico esempio di:", "options": ["X-Data (Experience Data), perché descrive l'esperienza soggettiva dell'acquirente.", "O-Data (Operational Data), perché descrive in maniera transazionale e quantitativa COSA è accaduto nei sistemi di business.", "Dark Data, poiché non può essere analizzato tramite strumenti di Business Intelligence.", "Unstructured Big Data, poiché i resi merce non hanno una collocazione nel database relazionale."], "correctIndex": 1, "explanation": "L'O-Data (Operational Data) rappresenta le informazioni transazionali generate dalle operazioni di business quotidiane (il 'COSA'). La motivazione soggettiva del reso (es. 'il prodotto è complicato da montare') costituisce invece l'X-Data (Experience Data)."}, {"id": 4, "question": "Cosa accade quando un'organizzazione intelligente combina con successo O-Data e X-Data all'interno di SAP BTP?", "options": ["L'ERP on-premise viene automaticamente decommissionato per motivi di conformità GDPR.", "L'azienda è in grado di capire sia COSA sta accadendo (dati operativi) sia PERCHÉ sta accadendo (dati di esperienza), trasformando l'insight in azioni immediate correttive o predittive.", "I dati vengono convertiti automaticamente da formati relazionali a blockchain pubblica per garantire l'immutabilità.", "La piattaforma blocca ogni accesso esterno per tutelare i dati di produzione da anomalie di sistema."], "correctIndex": 1, "explanation": "La forza dell'Intelligent Enterprise risiede proprio nell'unire il 'COSA' (O-Data, es. ordini, resi, tempi) al 'PERCHÉ' (X-Data, sentiment, opinioni dei clienti con Qualtrics) per innescare processi decisionali informati e automazioni proattive."}, {"id": 5, "question": "Quali sono i quattro 'Pilastri Tecnologici' fondamentali su cui poggia l'offerta di SAP Business Technology Platform?", "options": ["Cloud, On-Premise, Hybrid e Mainframe.", "Database & Data Management, Analytics, Application Development & Integration, Intelligent Technologies.", "ABAP, Java, C++ e Swift.", "Finance, Human Resources, Supply Chain e Customer Experience."], "correctIndex": 1, "explanation": "L'architettura funzionale di SAP BTP si articola esattamente su 4 pilastri: 1) Database and Data Management, 2) Analytics, 3) Application Development and Integration, 4) Intelligent Technologies."}, {"id": 6, "question": "All'interno del pilastro 'Database and Data Management', quale prodotto rappresenta la soluzione cloud in-memory avanzata in grado di gestire dati relazionali, grafi, elaborazioni spaziali e document store in un unico motore?", "options": ["SAP Adaptive Server Enterprise (ASE).", "SAP Data Intelligence.", "SAP HANA Cloud.", "SAP Master Data Governance (MDG)."], "correctIndex": 2, "explanation": "SAP HANA Cloud è il database as a service (DBaaS) in-memory multi-modello di SAP, capace di combinare elaborazioni colonnari ad alte prestazioni con motori integrati per grafi, elaborazioni geospaziali, full-text search e machine learning."}, {"id": 7, "question": "In merito alla strategia architetturale 'Clean Core', qual è il principale vantaggio derivante dall'utilizzare SAP BTP per lo sviluppo di estensioni anziché personalizzare direttamente il sistema S/4HANA con codice Z modificato?", "options": ["Non è necessario assegnare autorizzazioni di sicurezza agli utenti finali che accedono alle app BTP.", "Il sistema S/4HANA rimane immune da debiti tecnici e modifiche invasive, permettendo di eseguire aggiornamenti, patch e upgrade continui senza blocchi o costose regressioni.", "I costi di banda internet vengono totalmente azzerati poiché BTP risiede fisicamente nello stesso server di S/4HANA.", "Le tabelle di database del sistema centrale vengono replicate su cloud pubblici senza richiedere licenze."], "correctIndex": 1, "explanation": "Il Clean Core è la pietra angolare della moderna architettura SAP: mantenendo il core ERP pulito da modifiche custom e spostando le estensioni su BTP (side-by-side), gli aggiornamenti di S/4HANA diventano rapidi, standardizzati e a basso rischio operativo."}, {"id": 8, "question": "Quale tra le seguenti componenti fa parte di 'SAP Integration Suite' ed è specializzata nel fornire oltre 160 connettori preconfigurati e standardizzati verso sistemi SaaS non-SAP (es. Salesforce, ServiceNow, Workday)?", "options": ["SAP Event Mesh.", "Open Connectors.", "API Management.", "Cloud Connector."], "correctIndex": 1, "explanation": "Open Connectors è il servizio di SAP Integration Suite che mette a disposizione oltre 160 connettori armonizzati con autenticazione standardizzata e risorse normalizzate per dialogare con le più diffuse soluzioni di terze parti."}, {"id": 9, "question": "Come si posiziona 'Industry Cloud' all'interno della strategia globale dell'Intelligent Enterprise?", "options": ["È una linea di server fisici personalizzati venduti da SAP per installazioni on-premise nei singoli stabilimenti produttivi.", "È un insieme di soluzioni verticali e modulari per specifici settori (Retail, Automotive, ecc.) costruite su SAP BTP, che interoperano con l'Intelligent Suite grazie a API aperte e al One Domain Model.", "È un programma di dismissione graduale del software SAP a favore di applicazioni open-source proprietarie.", "È un protocollo di crittografia di rete dedicato alle transazioni finanziarie interbancarie."], "correctIndex": 1, "explanation": "L'Industry Cloud fornisce estensioni applicative verticali su SAP BTP basate sulle best practice di specifici settori di business, sviluppate da SAP e dai suoi partner con architettura aperta e One Domain Model per dialogare con le app dell'Intelligent Suite."}, {"id": 10, "question": "Qual è il beneficio commerciale e operativo più rilevante offerto da SAP BTP ai Partner SAP rispetto al vecchio modello di sviluppo on-premise?", "options": ["I partner non hanno più bisogno di stipulare contratti di supporto con i clienti finali.", "Possono costruire pacchetti software e proprietà intellettuale (IP) multitenant, accelerare l'integrazione e distribuire le proprie soluzioni a livello globale attraverso il SAP Store.", "Tutti i codici sorgente dei partner diventano di pubblico dominio senza protezione brevettuale.", "I partner possono modificare il codice sorgente kernel di SAP senza dover eseguire test di conformità."], "correctIndex": 1, "explanation": "Per i partner, SAP BTP è un abilitatore strategico di business: consente di sviluppare proprietà intellettuale su standard aperti, distribuirla con modelli multitenant SaaS e commercializzarla direttamente sul marketplace globale SAP Store."}]}, {"id": 2, "number": "02", "title": "Account Setup and Administration: Governance, Licensing & Operations", "shortTitle": "Account Setup and Administration", "part": "Part I: Getting Started", "readingTime": "30 min", "roles": ["Cloud Administrator", "BTP Platform Owner", "Enterprise Architect", "FinOps Specialist", "Security Officer"], "cleanSummaryHtml": "<p class=\"doc-p\">Il Capitolo 2 è la guida operativa essenziale per chiunque debba progettare, governare e amministrare una piattaforma SAP BTP in ambito aziendale. Il successo o il fallimento di una strategia cloud dipendono dalla corretta impostazione della <strong>struttura degli account</strong>, del modello di <strong>licensing (FinOps)</strong> e delle <strong>politiche di sicurezza e allocazione delle quote</strong>.</p>\n<p class=\"doc-p\">Il capitolo illustra in dettaglio la gerarchia strutturale: <strong>Global Account</strong> (contratto legale con SAP), <strong>Directories</strong> (raggruppamenti logici per business unit o country), <strong>Subaccounts</strong> (unità fondamentali di isolamento per sicurezza, regione/Hyperscaler e deploy) fino agli <strong>Spaces</strong> applicativi (Cloud Foundry o namespace Kyma). Vengono confrontati i modelli commerciali tradizionali (Subscription) e a consumo (<strong>CPEA</strong> e <strong>Pay-as-you-go</strong>), con un focus cruciale sulla novità strategica del <strong>Free Tier Model</strong>, che permette di prototipare a costo zero e promuovere l'applicazione direttamente in produzione senza perdere configurazioni. Infine, vengono esaminati gli strumenti di amministrazione quotidiana: la gestione di <strong>Entitlements</strong> e <strong>Quotas</strong>, il <strong>Discovery Center</strong>, l'<strong>Estimator Tool</strong> e i <strong>Boosters</strong> per l'automazione dei setup.</p>", "figures": [{"figNumber": "Figura 2.1", "title": "Modelli Commerciali e Opzioni di Account SAP BTP", "image": "images/02_001.png", "explanation": "Confronto tra i modelli commerciali enterprise (CPEA Cloud Platform Enterprise Agreement, Pay-As-You-Go, Subscription) e l'opzione Free Tier / Trial per la sperimentazione."}, {"figNumber": "Figura 2.18", "title": "Gerarchia degli Account: Global Account, Directory e Subaccount", "image": "images/02_018.png", "explanation": "Struttura gerarchica di governance multilivello: dal Global Account centrale (contratto e quote complessive) alle Directory (raggruppamenti per business unit o geografie) fino ai Subaccount tecnici dedicati agli ambienti Dev, Test e Prod."}, {"figNumber": "Figura 2.29", "title": "Gestione e Assegnazione degli Entitlement ai Subaccount", "image": "images/02_029.png", "explanation": "Console amministrativa del BTP Cockpit per allocare quote di memoria (GB di Cloud Foundry o Kyma), istanze di database e credenziali di connettività tra i vari subaccount."}, {"figNumber": "Figura 2.34", "title": "Automazione del Provisioning tramite Boosters nel BTP Cockpit", "image": "images/02_034.png", "explanation": "Procedura guidata automatizzata (Booster) per la configurazione con un clic di ambienti complessi come SAP Launchpad Service, Cloud Transport Management e Workflow."}], "architectureDiagram": "\n┌────────────────────────────────────────────────────────────────────────────────────────┐\n│                        SAP BTP GLOBAL ACCOUNT (Customer Contract)                      │\n│   • Entitlements Pool (HANA, CF, Kyma, Integration Suite, SAC...)                      │\n│   • Global Account Admins • Audit Log Access • Cost/Credit Monitoring (FinOps)         │\n├────────────────────────────────────────────────────────────────────────────────────────┤\n│                                  DIRECTORIES (Optional)                                │\n│   ┌────────────────────────────────────────┐  ┌─────────────────────────────────────┐  │\n│   │ DIRECTORY: EMEA Operations             │  │ DIRECTORY: Americas Operations      │  │\n│   │ (Dedicated Entitlements & User Groups) │  │ (Dedicated Entitlements & Budgets)  │  │\n│   └───────────────────┬────────────────────┘  └──────────────────┬──────────────────┘  │\n├───────────────────────┼──────────────────────────────────────────┼─────────────────────┤\n│                       ▼                                          ▼                     │\n│   ┌────────────────────────────────────────┐  ┌─────────────────────────────────────┐  │\n│   │ SUBACCOUNT: Production (PRD)           │  │ SUBACCOUNT: Development (DEV)       │  │\n│   │ • Provider: AWS (eu-central-1 Frankfurt)│  │ • Provider: Azure (westeurope)      │  │\n│   │ • Cloud Connector: Connected to PRD ERP│  │ • Cloud Connector: DEV ERP Mock    │  │\n│   │ • High Availability & Strict Quotas    │  │ • Free Tier / Low Quota Pointers    │  │\n│   ├────────────────────────────────────────┤  ├─────────────────────────────────────┤  │\n│   │ CLOUD FOUNDRY ORG / KYMA CLUSTER       │  │ CLOUD FOUNDRY ORG / KYMA CLUSTER    │  │\n│   │ ┌──────────────────┐┌────────────────┐ │  │ ┌────────────────┐┌───────────────┐ │  │\n│   │ │ Space: prd-apps  ││ Space: prd-db  │ │  │ │ Space: dev-app ││ Space: test   │ │  │\n│   │ └──────────────────┘└────────────────┘ │  │ └────────────────┘└───────────────┘ │  │\n│   └────────────────────────────────────────┘  └─────────────────────────────────────┘  │\n├────────────────────────────────────────────────────────────────────────────────────────┤\n│              INFRASTRUCTURE PROVIDERS (Hyperscalers: AWS • Azure • GCP • Alibaba)      │\n└────────────────────────────────────────────────────────────────────────────────────────┘\n    ", "coreTopics": [{"title": "1. La Gerarchia degli Account: Global Account, Directories e Subaccounts", "cleanHtml": "<p class=\"doc-p\">La corretta strutturazione degli account in BTP previene colli di bottiglia operativi e falle di sicurezza:</p>\n<ul class=\"doc-list\">\n<li><strong>Global Account</strong>: È l'entità radice che rappresenta il contratto commerciale stipulato dal cliente con SAP. Viene gestito da pochi <em>Global Account Administrators</em>. Non contiene codice o applicazioni eseguibili direttamente, ma ospita il paniere complessivo delle licenze (<em>Entitlement Set</em>) e i crediti contrattuali.</li>\n<li><strong>Directories</strong>: Livello opzionale intermedio che permette di organizzare i subaccount gerarchicamente per Divisione Aziendale (es. HR, Finance, Supply Chain), per Regione Geografica (es. EMEA, LATAM, APAC) o per tipologia di ambiente. Consentono di assegnare quote contrattuali dedicate a specifici centri di costo.</li>\n<li><strong>Subaccount</strong>: È l'unità fondamentale di isolamento operativo, logico e di sicurezza. Ogni subaccount è ancorato in modo permanente a una <strong>specifica Regione geografica</strong> e a uno <strong>specifico Hyperscaler</strong> (es. AWS Francoforte, Microsoft Azure Amsterdam, GCP Virginia). Il subaccount definisce chi ha accesso (membri e ruoli), quali quote sono utilizzabili, le connessioni sicure verso i sistemi on-premise (tramite Cloud Connector) e le destinazioni API (<em>Destinations</em>).</li>\n<li><strong>Runtime Environments (Spaces/Namespaces)</strong>: All'interno del subaccount si abilitano gli ambienti di esecuzione (es. Cloud Foundry Org suddivisa in <em>Spaces</em>, o cluster Kyma con <em>Kubernetes Namespaces</em>).</li>\n</ul>"}, {"title": "2. Modelli di Trial a Confronto: BTP Trial vs Enterprise Trial vs Free Tier", "cleanHtml": "<p class=\"doc-p\">Comprendere i modelli gratuiti è cruciale per impostare Proof-of-Concept (PoC) efficaci senza buttare via il lavoro:</p>\n<ul class=\"doc-list\">\n<li><strong>SAP BTP Trial (Personale)</strong>: Account gratuito per sviluppatori individuali (raggiungibile su <em>hanatrial.ondemand.com</em>). Dura 30 giorni (rinnovabile fino a 365 giorni tramite popup di estensione). È ospitato su infrastruttura condivisa a risorse ridotte, privo di SLA, e soprattutto <strong>non consente in alcun modo il trasferimento del lavoro o dei dati verso un account produttivo</strong>.</li>\n<li><strong>Enterprise Trial</strong>: Concesso da SAP per trattative commerciali a clienti enterprise (tipicamente 90 giorni). Offre quote quasi paritetiche a un ambiente reale, ma al termine del periodo di prova l'account e tutti i dati vengono distrutti; non è prevista la migrazione in produzione.</li>\n<li><strong>Free Tier Model (La Scelta Architetturale Raccomandata)</strong>: Attivabile all'interno di un account commerciale reale (Pay-as-you-go o CPEA). Fornisce oltre 20 servizi con piani gratuiti dedicati (es. SAP Launchpad con limite a 20 utenti, runtime Kyma con 4 CPU, ecc.) senza scadenza temporale fissa. Il vantaggio determinante: <strong>quando il PoC ha successo, basta cambiare il Service Plan da 'free' a 'paid' nello stesso subaccount</strong> e la soluzione diventa immediatamente produttiva, senza perdere configurazioni, identità o dati.</li>\n</ul>"}, {"title": "3. Modelli Commerciali: Subscription vs CPEA vs Pay-As-You-Go", "cleanHtml": "<p class=\"doc-p\">La strategia di acquisto determina la flessibilità dell'innovazione aziendale:</p>\n<ul class=\"doc-list\">\n<li><strong>Single-Service Subscription (Tradizionale a distinta base)</strong>: Il cliente acquista in anticipo specifici servizi a prezzo fisso con contratti pluriennali (es. 100 utenti di SAP Integration Suite per 36 mesi). Svantaggio: rigidità estrema. Se dopo 6 mesi l'azienda vuole sperimentare Kyma o SAC, deve avviare una complessa rinegoziazione contrattuale.</li>\n<li><strong>CPEA (Cloud Platform Enterprise Agreement)</strong>: Modello a consumo prepagato. L'azienda effettua un impegno finanziario annuale in crediti (Cloud Credits) godendo di sconti a volume consistenti. Ogni mese i crediti vengono scalati in base al consumo effettivo su un catalogo aperto di oltre 85 servizi BTP. Ideale per aziende con fabbisogni consolidati e roadmap evolutive.</li>\n<li><strong>Pay-as-you-go</strong>: Nessun investimento anticipato, nessun impegno monetario minimo. L'azienda riceve una fattura post-pagamento mensile basata unicamente sulle risorse CPU/RAM/API effettivamente consumate. È il punto di partenza perfetto per avviare iniziative pilota a rischio finanziario zero.</li>\n</ul>"}, {"title": "4. Strategie di Subaccount Setup nel Lavoro Quotidiano", "cleanHtml": "<p class=\"doc-p\">Nel design di un landscape enterprise, SAP prescrive 3 pattern architetturali per la separazione dei subaccount:</p>\n<ol class=\"doc-steps\">\n<li><strong>Multi-Stage Staged Setup (DEV -> QA/TEST -> PROD)</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>È la configurazione obbligatoria per conformità SOX, GxP e standard ISO.</li>\n<li>Ogni ambiente (Sviluppo, Collaudo, Produzione) risiede in un <strong>subaccount separato</strong>.</li>\n<li>Vantaggio: totale isolamento dei dati sensibili di produzione, configurazioni di sicurezza e ruoli distinte, e collegamento del Cloud Connector solo ai rispettivi sistemi ERP (es. Subaccount DEV collegato a S/4HANA DEV).</li>\n</ul>\n<ol class=\"doc-steps\">\n<li><strong>Setup per Line of Business (LoB) con Governance Centrale</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>Vengono creati subaccount o directory dedicate a specifiche funzioni aziendali (es. Subaccount Vendite, Subaccount Risorse Umane, Subaccount Finance).</li>\n<li>Consente di riaddebitare con precisione chirurgica i costi BTP (tramite report dei crediti) ai rispettivi centri di costo aziendali.</li>\n</ul>\n<ol class=\"doc-steps\">\n<li><strong>Setup con Subaccount DEV dedicati per Progetto e CI/CD unificato</strong>:</li>\n</ol>\n<ul class=\"doc-list\">\n<li>I team di sviluppo lavorano su subaccount dedicati per non interferire a vicenda sulle quote; le app vengono poi rilasciate e consolidate nei subaccount centralizzati di QA e PROD tramite pipeline automatizzate di CI/CD.</li>\n</ul>"}, {"title": "5. Amministrazione Operativa: Entitlements, Quotas e Service Plans", "cleanHtml": "<p class=\"doc-p\">Come governare le risorse per evitare sprechi e blocchi operativi:</p>\n<ul class=\"doc-list\">\n<li><strong>Entitlements</strong>: Rappresentano il diritto legale e contrattuale ad utilizzare una determinata funzionalità o software su BTP. Vengono assegnati a livello di Global Account.</li>\n<li><strong>Quotas (Quote di servizio)</strong>: Il quantitativo numerico associato a un entitlement (es. 32 GB di memoria per Cloud Foundry, 2 istanze di SAP HANA Cloud, 500.000 chiamate API).</li>\n<li><strong>Allocazione ai Subaccount</strong>: Un servizio non è utilizzabile in un subaccount finché l'amministratore del Global Account non ne assegna esplicitamente una porzione di quota a quel subaccount (menu <em>Entitlements -> Service Assignments</em>).</li>\n<li><strong>Service Plans</strong>: All'interno dello stesso entitlement esistono diversi piani (es. <em>standard</em>, <em>lite</em>, <em>free</em>, <em>enterprise</em>). Ciascun piano offre livelli di servizio (SLA), scalabilità e costi differenti.</li>\n</ul>"}, {"title": "6. Strumenti Essenziali dell'Architetto: Discovery Center ed Estimator Tool", "cleanHtml": "<p class=\"doc-p\">Gli strumenti di pianificazione che ogni professionista SAP BTP deve padroneggiare:</p>\n<ul class=\"doc-list\">\n<li><strong>SAP Discovery Center (discovery-center.cloud.sap)</strong>: Il portale di riferimento assoluto. Contiene:</li>\n<li><em>Services Catalog</em>: Mappa aggiornata di tutti i servizi BTP, con disponibilità per singola regione e hyperscaler (AWS, Azure, GCP), piani tariffari e documentazione.</li>\n<li><em>Missions</em>: Guide passo-passo complete e architetture di riferimento testate da SAP per implementare specifici casi d'uso (es. 'Estendere SuccessFactors con Event Mesh').</li>\n<li><strong>SAP BTP Estimator Tool</strong>: Calcolatore interattivo per stimare i costi operativi mensili. Permette di selezionare i servizi desiderati, specificare metriche (utenti, GB RAM, gigabyte di storage, chiamate API) e ottenere la stima esatta in crediti CPEA o valuta reale prima di avviare il progetto.</li>\n<li><strong>Boosters</strong>: Procedure guidate (wizard) nel Cockpit di BTP che automatizzano in sequenza fino a 15 compiti manuali (creazione subaccount, attivazione Cloud Foundry, assegnazione quote, abbonamento alle app e associazione dei ruoli agli utenti).</li>\n</ul>"}], "keyDefinitions": [{"term": "Global Account", "definition": "Rappresentazione tecnica e contrattuale dell'accordo stipulato tra il cliente e SAP. Raccoglie tutti gli entitlement contrattuali, gestisce la fatturazione/FinOps e consente la creazione e supervisione di directories e subaccounts."}, {"term": "Subaccount", "definition": "Unità logica e operativa indipendente all'interno di un Global Account. È vincolato in modo immutabile a una regione geografica e a un data center (Hyperscaler) specifico. Isola sicurezza, quote, applicazioni, destinazioni e connessioni Cloud Connector."}, {"term": "Directories", "definition": "Livello organizzativo intermedio facoltativo posizionato tra il Global Account e i Subaccounts. Utilizzato nelle grandi aziende per raggruppare subaccount per business unit, area geografica o team, con la possibilità di assegnare quote contrattuali dedicate."}, {"term": "Entitlement & Quota", "definition": "L'Entitlement è il diritto contrattuale a consumare un determinato servizio su SAP BTP. La Quota rappresenta la misura quantitativa massima di risorsa assegnata (es. gigabyte di RAM, numero di istanze, chiamate API o utenti attivi mensili)."}, {"term": "Free Tier Model", "definition": "Opzione di consumo gratuito integrata nei contratti commerciali (Pay-as-you-go o CPEA) che mette a disposizione versioni con quote limitate di oltre 20 servizi BTP, con la possibilità di convertire istanze e dati direttamente in produzione cambiando il piano da free a paid."}, {"term": "CPEA (Cloud Platform Enterprise Agreement)", "definition": "Modello commerciale basato su un impegno monetario anticipato in Cloud Credits a tariffa scontata, con fatturazione e deduzione mensile a consumo effettivo su tutti i servizi della piattaforma BTP."}, {"term": "Pay-As-You-Go", "definition": "Modello commerciale cloud privo di impegni finanziari anticipati o volumi minimi obbligatori: il cliente riceve una fattura mensile post-consumo calcolata esclusivamente sui servizi e sulle risorse effettivamente utilizzati."}, {"term": "Cloud Connector", "definition": "Componente software on-premise (installato nella DMZ aziendale) che stabilisce un tunnel TLS sicuro e cifrato bidirezionale verso il subaccount SAP BTP, consentendo alle app cloud di accedere ai sistemi interni senza aprire porte in ingresso nel firewall aziendale."}, {"term": "SAP Discovery Center", "definition": "Piattaforma web ufficiale di SAP che racchiude il catalogo completo dei servizi BTP (con matrice delle regioni e prezzi), architetture di riferimento e guide guidate ('Missions') per la realizzazione di scenari applicativi."}, {"term": "Boosters", "definition": "Script e procedure guidate integrate nell'interfaccia SAP BTP Cockpit che automatizzano la configurazione end-to-end di scenari architetturali complessi (creazione subaccount, provisioning runtime, quote e assegnazione ruoli) riducendo gli errori umani."}], "workplaceBestPractices": [{"riskLevel": "CRITICO", "rule": "Isola tassativamente gli ambienti", "reason": "non configurare mai servizi di Sviluppo (DEV) e di Produzione (PRD) nello stesso Subaccount BTP. Usa sempre subaccount separati per rispettare le normative di sicurezza e audit."}, {"riskLevel": "ALTO", "rule": "Seleziona la Regione dell'Hyperscaler considerando la prossimità fisica", "reason": "crea i subaccount BTP nella stessa regione geografica (o data center più vicino) in cui risiede il tuo ERP on-premise o cloud (es. AWS Frankfurt per aziende con sede in centro Europa), per minimizzare la latenza di rete."}, {"riskLevel": "ALTO", "rule": "Nel dimensionamento economico dei progetti, consulta sempre l'Estimator Tool su Discovery Center prima della firma contrattuale, includendo un cuscinetto del 15-20% sui consumi di memoria HANA e chiamate API.", "reason": "Standard architetturale raccomandato da SAP per la stabilità e la sicurezza operativa."}, {"riskLevel": "MEDIO", "rule": "Assegna sempre il ruolo di Global Account Administrator ad almeno due persone distinte (per garantire il Disaster Recovery organizzativo) e non condividere mai utenze generiche; integra un Identity Provider (IdP) aziendale (es. Azure AD / Okta) appena creato il primo subaccount.", "reason": "Standard architetturale raccomandato da SAP per la stabilità e la sicurezza operativa."}, {"riskLevel": "MEDIO", "rule": "Sfrutta il Free Tier Model per i Proof of Concept aziendali", "reason": "evita di fare test in account BTP Trial personali per non dover riscrivere o riconfigurare l'intero progetto da capo durante il passaggio in produzione."}], "quiz": [{"id": 1, "question": "Qual è la differenza fondamentale, ai fini del passaggio in produzione di un Proof-of-Concept, tra un account 'SAP BTP Trial' e il 'Free Tier Model'?", "options": ["L'account SAP BTP Trial richiede una carta di credito aziendale, mentre il Free Tier è riservato agli studenti universitari.", "In SAP BTP Trial non è tecnicamente possibile migrare dati o applicazioni verso un account produttivo, mentre nel Free Tier basta modificare il Service Plan da 'free' a 'paid' mantenendo tutte le configurazioni attive.", "Il Free Tier scade tassativamente dopo 30 giorni senza possibilità di rinnovo, mentre l'account Trial non ha alcuna scadenza.", "Non vi è alcuna differenza tecnica; il Free Tier è semplicemente il vecchio nome commerciale di SAP BTP Trial."], "correctIndex": 1, "explanation": "L'account SAP BTP Trial è un ambiente isolato e 'a perdere', pensato per lo studio personale: nulla di quanto creato può essere trasferito in produzione. Il Free Tier opera invece all'interno del Global Account commerciale del cliente, permettendo di trasformare il PoC in applicazione produttiva con un semplice cambio di piano di servizio."}, {"id": 2, "question": "Un'azienda desidera iniziare a sperimentare applicazioni su SAP BTP ma il comitato di bilancio rifiuta di approvare impegni di spesa finanziari minimi anticipati. Quale modello commerciale è il più appropriato?", "options": ["Single-Service Subscription triennale.", "Cloud Platform Enterprise Agreement (CPEA) con anticipo di 50.000 crediti.", "Pay-as-you-go, poiché non richiede alcun investimento iniziale e addebita i costi solo a consuntivo sul consumo reale.", "Enterprise Agreement On-Premise con licenza perpetua."], "correctIndex": 2, "explanation": "Pay-as-you-go è la formula più flessibile di SAP BTP: zero investimento iniziale, nessun canone minimo fisso e fatturazione mensile posticipata basata esclusivamente sulle risorse e sui servizi effettivamente erogati."}, {"id": 3, "question": "All'interno dell'architettura di account di SAP BTP, quale delle seguenti affermazioni su un 'Subaccount' è corretta?", "options": ["Un Subaccount può estendersi contemporaneamente su più data center e regioni geografiche per garantire il bilanciamento automatico del carico.", "Un Subaccount è permanentemente legato a una specifica Regione geografica e a un determinato Infrastructure Provider (Hyperscaler).", "Un Subaccount contiene tutti i contratti legali e le fatture inviate da SAP all'azienda.", "In un Global Account è consentito creare al massimo un solo Subaccount per ciascun tenant SAP."], "correctIndex": 1, "explanation": "Al momento della creazione, ogni Subaccount deve essere obbligatoriamente associato a una specifica Regione e a un data center di un provider (es. AWS Europe Frankfurt, Microsoft Azure Netherlands). Questa scelta è permanente e determina dove risiederanno fisicamente i dati e le applicazioni."}, {"id": 4, "question": "Quale ruolo svolgono le 'Directories' all'interno della gerarchia di SAP BTP?", "options": ["Servono unicamente per memorizzare il codice sorgente ABAP dei programmatori.", "Fungono da cartelle logiche intermedie tra il Global Account e i Subaccounts per organizzare e governare i subaccount per divisione, paese o team, permettendo anche la ripartizione mirata delle quote.", "Sostituiscono i server DNS on-premise all'interno della rete aziendale.", "Sono componenti hardware fisici installati presso i data center SAP."], "correctIndex": 1, "explanation": "Le Directories sono elementi organizzativi opzionali ma essenziali nelle grandi organizzazioni: consentono di raggruppare gerarchicamente i subaccount (ad es. per area geografica come EMEA o per divisione come HR/Finance) e distribuire budget e quote in modo strutturato."}, {"id": 5, "question": "Uno sviluppatore non riesce a sottoscrivere il servizio 'SAP Launchpad service' (ora SAP Build Work Zone) all'interno del proprio Subaccount DEV. Qual è la causa più probabile?", "options": ["Lo sviluppatore ha dimenticato di riavviare il proprio computer portatile.", "L'amministratore del Global Account non ha ancora allocato la quota dell'entitlement di quel servizio al Subaccount DEV.", "I servizi BTP sono disponibili unicamente se il subaccount è configurato in lingua inglese.", "Il servizio richiede tassativamente la disattivazione del firewall aziendale."], "correctIndex": 1, "explanation": "Affinché un servizio sia utilizzabile o sottoscrivibile all'interno di un Subaccount, deve prima essergli assegnata una quota dell'Entitlement corrispondente dal Global Account (tramite la gestione Entitlements -> Service Assignments)."}, {"id": 6, "question": "Qual è il principale vantaggio nell'utilizzare un 'Booster' all'interno di SAP BTP Cockpit?", "options": ["Aumenta la frequenza di clock della CPU dei server SAP del 50%.", "Automatizza in sequenza una catena complessa di passaggi amministrativi (creazione subaccount, attivazione runtime, assegnazione quote, abbonamento servizi e concessione ruoli) con un unico wizard guidato.", "Consente di scaricare i database HANA su file Excel senza autorizzazioni di sicurezza.", "Elimina la necessità di sottoscrivere un contratto di licenza con SAP."], "correctIndex": 1, "explanation": "I Booster sono wizard guidati progettati da SAP per automatizzare molteplici step manuali e configurare scenari architetturali completi (es. preparazione ambiente Workflow, Kyma o Mobile) in pochi minuti, azzerando gli errori di configurazione umana."}, {"id": 7, "question": "Perché la best practice architetturale di SAP raccomanda caldamente di mantenere subaccount rigorosamente separati per DEV, QA e PROD?", "options": ["Perché SAP addebita costi aggiuntivi se gli sviluppatori condividono lo stesso subaccount.", "Per garantire il completo isolamento dei dati sensibili, prevenire modifiche accidentali in produzione, segregare gli accessi di sicurezza e collegare il Cloud Connector solo agli ambienti ERP corrispondenti.", "Perché i sistemi di produzione non supportano i browser web moderni come Google Chrome.", "Per consentire agli sviluppatori di rilasciare codice in produzione senza dover eseguire test di collaudo."], "correctIndex": 1, "explanation": "La segregazione degli ambienti (DEV, QA, PROD) in subaccount distinti garantisce la separazione dei compiti (SoD), impedisce che test o carichi anomali in sviluppo degradino la produzione, isola i dati reali e rispetta i requisiti di conformità e audit."}, {"id": 8, "question": "In merito alla disponibilità dei servizi su SAP BTP, quale strumento ufficiale deve consultare l'Enterprise Architect per verificare se un servizio è supportato su un determinato Hyperscaler (es. AWS Europe vs Azure Switzerland)?", "options": ["Il codice sorgente di SAP GUI.", "SAP Discovery Center (sezione Services Catalog).", "Il registro degli eventi di Windows Server.", "Il forum pubblico Reddit dedicato a SAP."], "correctIndex": 1, "explanation": "Il Services Catalog del SAP Discovery Center fornisce la matrice ufficiale e in tempo reale della disponibilità di ciascun servizio BTP per regione geografica, data center e fornitore di infrastruttura (AWS, Microsoft Azure, Google Cloud, Alibaba)."}, {"id": 9, "question": "Cosa si intende per 'Cloud Connector' e dove viene installato nell'architettura aziendale?", "options": ["Un cavo di fibra ottica proprietario venduto da SAP da installare tra la sede del cliente e il data center di Walldorf.", "Un'applicazione software on-premise installata nella DMZ aziendale che instaura un tunnel TLS crittografato verso il Subaccount BTP senza dover aprire porte di ingresso nel firewall aziendale.", "Un'estensione per Microsoft Excel utilizzata per caricare le anagrafiche dei fornitori.", "Un plugin installato sui telefoni cellulari degli impiegati per accedere alle mail aziendali."], "correctIndex": 1, "explanation": "SAP Cloud Connector è il componente di integrazione on-premise più importante: si installa nella rete protetta (DMZ) e stabilisce una connessione inversa sicura (dall'interno verso il cloud BTP). In questo modo le app su BTP comunicano con l'ERP on-premise senza esporre il sistema su internet o aprire porte aperte nel firewall."}, {"id": 10, "question": "Nell'ambito del modello commerciale CPEA (Cloud Platform Enterprise Agreement), cosa accade se un'azienda consuma più crediti di quelli inizialmente concordati nel contratto annuale?", "options": ["Tutti i server cloud dell'azienda vengono immediatamente arrestati e i dati cancellati per inadempienza contrattuale.", "I consumi eccedenti (overage) continuano a essere erogati senza alcuna interruzione di servizio e vengono fatturati a conguaglio con tariffazione prestabilita.", "Il sistema passa automaticamente a un abbonamento personale gratuito limitato a due utenti.", "La piattaforma blocca ogni nuova chiamata API fino al rinnovo del contratto annuale successivo."], "correctIndex": 1, "explanation": "Nel modello CPEA la continuità del business è sempre garantita: se il credito prepagato si esaurisce prima della fine del periodo contrattuale, i servizi continuano a funzionare regolarmente e l'eccedenza viene fatturata come 'overage' alle tariffe contrattuali concordate."}]}, {"id": 3, "number": "03", "title": "Architecture Design Patterns & Development Approach", "shortTitle": "Architecture Design Patterns & Development Approach", "part": "Part II: Architecture & Design", "readingTime": "35 min", "roles": ["Enterprise Architect", "Solution Architect", "Lead Developer", "Integration Architect", "DevOps Engineer"], "cleanSummaryHtml": "<p class=\"doc-p\">Il Capitolo 3 costituisce il fondamento metodologico ed ingegneristico per chiunque progetti soluzioni su SAP BTP. Costruire applicazioni nel cloud richiede un rigido rispetto dei principi di <strong>Enterprise Architecture</strong>: senza un blueprint strutturato, il rischio di generare caos applicativo e debito tecnico ingestibile è elevatissimo.</p>\n<p class=\"doc-p\">Il capitolo adotta il framework <strong>TOGAF ADM</strong> (Architecture Development Method) combinandolo con il <strong>Lean Enterprise Architecture Toolkit</strong> e l'integrazione sinergica tra <strong>Design Thinking</strong> (empatia e visione user-centric) e <strong>Architectural Thinking</strong> (fattibilità tecnica e robustezza ingegneristica). Vengono poi sviscerati i 4 pattern architetturali cardine del cloud moderno: <strong>Microservizi</strong>, <strong>Cloud-Native (12-Factor App)</strong>, <strong>Serverless</strong> ed <strong>Event-Driven Architecture (EDA)</strong> basata sullo standard <em>CloudEvents</em> e su <em>SAP Event Mesh</em>. Vengono messi a confronto i runtime applicativi di BTP (<strong>Cloud Foundry</strong> vs <strong>Kyma</strong> vs <strong>ABAP Environment</strong>) e viene codificato il ciclo di sviluppo end-to-end in 5 fasi imprescindibili: <strong>Connect -> Build -> Add Channels -> Deploy -> Operate</strong>. Infine, la <strong>SAP Application Extension Methodology</strong> fornisce la bussola decisionale tra <em>In-App</em> e <em>Side-by-Side Extensibility</em>.</p>", "figures": [{"figNumber": "Figura 3.1", "title": "Fasi del Ciclo di Vita Architetturale TOGAF ADM", "image": "images/03_001.png", "explanation": "Applicazione del framework TOGAF (dalla Visione Architetturale alla Business, Information Systems e Technology Architecture) adattato ai progetti agili su SAP BTP."}, {"figNumber": "Figura 3.2", "title": "Sinergia tra Design Thinking e Architectural Thinking", "image": "images/03_002.png", "explanation": "Integrazione metodologica: il Design Thinking esplora e valida i bisogni reali degli utenti di business (il COSA e il PERCHÉ), mentre l'Architectural Thinking progetta la fattibilità tecnica, la sicurezza e la scalabilità (il COME)."}, {"figNumber": "Figura 3.11", "title": "Template di Baseline Solution Architecture", "image": "image
