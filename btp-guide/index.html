idato vengono cancellati per motivi di sicurezza.", "L'anagrafica del candidato viene convertita automaticamente in dipendente effettivo attivo in Employee Central, e l'accesso ai sistemi aziendali viene trasferito dall'email personale all'utenza definitiva di rete interna.", "Il candidato deve sostenere un secondo ciclo di colloqui di selezione.", "Lo stipendio del primo mese viene automaticamente devoluto in beneficenza."], "correctIndex": 1, "explanation": "Al Day 1 si compie la transizione formale: il profilo passa automaticamente da candidato a dipendente attivo in Employee Central, disattivando il portale provvisorio di pre-hire e abilitando l'accesso con le credenziali aziendali interne complete."}, {"id": 9, "question": "In merito al 'Clean Core', perché la realizzazione di questa soluzione per Aceme Inc. su SAP BTP è preferibile rispetto a tentare di modificare i programmi standard di SuccessFactors?", "options": ["Perché SAP SuccessFactors è una soluzione SaaS multitenant nel cloud il cui codice sorgente centrale non è accessibile né modificabile dai clienti, rendendo la 'Side-by-Side Extensibility' su BTP l'unica architettura supportata ed elegante per creare esperienze su misura.", "Perché la modifica del codice sorgente di SuccessFactors richiede l'uso di una macchina da scrivere meccanica.", "Perché le modifiche nel core di SuccessFactors causano la cancellazione dei dati di produzione ogni fine settimana.", "Non vi è alcun motivo tecnico; le due soluzioni sono identiche."], "correctIndex": 0, "explanation": "Nel modello cloud SaaS come SuccessFactors il codice sorgente condiviso tra tutti i clienti non è modificabile direttamente: la Side-by-Side Extensibility su SAP BTP rappresenta l'unico approccio architetturale supportato, garantendo personalizzazioni ricche senza intaccare il core SaaS."}, {"id": 10, "question": "Quale elemento di design (Gamification) presente in SAP SuccessFactors Work Zone incentiva il candidato a completare rapidamente tutte le pratiche prima della scadenza?", "options": ["L'invio di allarmi sonori a volume massimo sul telefono del candidato ogni 5 minuti.", "Indicatori grafici di progresso a tappe, milestone visive e checklist dinamiche che mostrano con chiarezza la percentuale di completamento del percorso e i compiti rimanenti.", "La minaccia di licenziamento immediato inviata tramite telegramma cartaceo.", "La visualizzazione del saldo del conto corrente dei dirigenti aziendali."], "correctIndex": 1, "explanation": "Le micro-interazioni e la gamification (barre di avanzamento, badge di completamento, checklist chiare) trasformano la tediosa burocrazia in un percorso intuitivo e rassicurante, motivando il futuro dipendente a completare i task in anticipo."}]}, {"id": 15, "number": "15", "title": "Use Case: Integrating the COVID-19 Risk Index with SAP Concur", "shortTitle": "Use Case", "part": "Part III: Real-world Use Cases", "readingTime": "35 min", "roles": ["Solution Architect", "ABAP Cloud Developer", "Travel & Expense Specialist", "Risk & Compliance Officer", "Integration Consultant"], "cleanSummaryHtml": "<p class=\"doc-p\">Il Capitolo 15 presenta un caso d'uso altamente pragmatico incentrato sul dovere di protezione aziendale (<strong>Duty of Care</strong>) e sulla gestione del rischio di viaggio: come arricchire ed estendere <strong>SAP Concur Travel & Expense</strong> integrando feed di dati esterni sanitari (<strong>COVID-19 Risk Index</strong>) tramite SAP BTP. Attraverso l'esempio reale di <strong>Qitic Inc.</strong> (società di consulenza IT con sede a Seattle i cui professionisti viaggiano costantemente per progetti on-site), il capitolo mostra come tutelare la salute dei dipendenti e prevenire costosi blocchi operativi.</p>\n<p class=\"doc-p\">Mentre SAP Concur eccelle nella prenotazione di voli, hotel e note spese nel rispetto delle policy di costo aziendali, non dispone nativamente di telemetrie sanitarie o geopolitiche in tempo reale. In periodi di emergenza pandemica o crisi locale, le condizioni nelle città di destinazione possono mutare nel giro di poche ore. La soluzione architetturale realizzata su SAP BTP sfrutta <strong>SAP BTP, ABAP Environment (Steampunk)</strong> per orchestrare l'acquisizione dei dati di rischio da API REST pubbliche, confrontarli con gli itinerari estratti via OAuth 2.0 da <strong>SAP Concur</strong>, calcolare un indice di pericolo composito e innescare notifiche preventive automatiche via email (attraverso <strong>SAP Cloud Connector</strong>) verso il dipendente e il manager, consigliando tempestivamente il passaggio a modalità di lavoro da remoto.</p>", "figures": [{"figNumber": "Figura 15.1", "title": "Solution Context Diagram: Caso Qitic Inc. (Duty of Care & SAP Concur)", "image": "images/15_001.png", "explanation": "Obbligo di tutela dei viaggiatori d'affari (Duty of Care): necessità di monitorare in tempo reale il rischio pandemico e sanitario delle destinazioni dei dipendenti prenotate su SAP Concur."}, {"figNumber": "Figura 15.3", "title": "Solution Concept Diagram: Risk Hub su SAP BTP ABAP Environment", "image": "images/15_003.png", "explanation": "Architettura basata su ABAP Steampunk: ricezione automatica degli itinerari da Concur, interrogazione di API sanitarie pubbliche esterne, e trigger di alert via Cloud Connector verso il server mail on-premise."}, {"figNumber": "Figura 15.4", "title": "Solution Realization Diagram di Qitic Inc.", "image": "images/15_004.png", "explanation": "Dettaglio di rilascio tecnico: classe ABAP con job pianificato periodico, consumo sicuro di API OAuth 2.0 esterne tramite Destination Service e dashboard Fiori per il risk management."}], "architectureDiagram": "\n┌────────────────────────────────────────────────────────────────────────────────────────┐\n│                        DUTY OF CARE TRAVEL RISK HUB (QITIC INC.)                       │\n├────────────────────────────────────────────────────────────────────────────────────────┤\n│ 1. EXTERNAL DATA SOURCE (Public Health API)                                            │\n│    • Public COVID-19 / Health Risk REST API (Real-time Infection Rates & Restrictions) │\n├────────────────────────────────────────────────────────────────────────────────────────┤\n│ 2. CORE ORCHESTRATION & LOGIC: SAP BTP, ABAP ENVIRONMENT (Steampunk)                   │\n│    ┌────────────────────────────────────────────────────────────────────────────────┐  │\n│    │ • Background Daemon Job (Scheduled Execution)                                  │  │\n│    │ • HTTP Outbound Client: Calls External Risk API & Pulls Concur Itineraries     │  │\n│    │ • Risk Engine: Computes composite danger score per Destination Postal Code     │  │\n│    │ • Policy Matrix: If Risk > Threshold ──▶ Flags Travel & Triggers Alert Action  │  │\n│    └──────────────────────┬─────────────────────────────────┬───────────────────────┘  │\n│                           │                                 │                          │\n├───────────────────────────┼─────────────────────────────────┼──────────────────────────┤\n│ 3. TRAVEL ECOSYSTEM       ▼                                 ▼ 4. SECURE NOTIFICATIONS  │\n│    ┌──────────────────────────────────────┐   ┌─────────────────────────────────────┐  │\n│    │ SAP CONCUR CLOUD APIS                │   │ SAP CLOUD CONNECTOR (Reverse Tunnel)│  │\n│    │ • OAuth 2.0 Itinerary & Booking API  │   │ • Secure access to on-premise SMTP  │  │\n│    │ • Travel Request Feeds               │   │ • Encrypted TLS Email Dispatch      │  │\n│    └──────────────────────────────────────┘   └──────────────────┬──────────────────┘  │\n│                                                                  ▼                     │\n│                                               EMPLOYEE & PROJECT MANAGER INBOX         │\n│                                               • Immediate Risk Warning Alert           │\n│                                               • Recommendation to switch to Remote Work│\n└────────────────────────────────────────────────────────────────────────────────────────┘\n    ", "coreTopics": [{"title": "1. Il Contesto di Business: La Sfida di Qitic Inc. e il Duty of Care", "cleanHtml": "<p class=\"doc-p\">La responsabilità legale e morale dell'azienda nei confronti dei viaggiatori d'affari:</p>\n<ul class=\"doc-list\">\n<li><strong>Lo Scenario</strong>: Qitic Inc., azienda di consulenza tecnologica di Seattle, gestisce centinaia di consulenti senior che si spostano settimanalmente per interventi architetturali critici presso le sedi dei clienti.</li>\n<li><strong>Il Dovere di Protezione (Duty of Care)</strong>:</li>\n<li>Le normative sul lavoro internazionali impongono alle imprese l'obbligo giuridico di garantire la massima sicurezza fisica e sanitaria ai propri dipendenti durante le trasferte di lavoro.</li>\n<li><strong>I Limiti di SAP Concur Standard</strong>:</li>\n<li>SAP Concur verifica perfettamente che l'hotel non costi più di 150€ a notte o che il volo sia in classe economica, ma <strong>è del tutto 'cieco' rispetto alle condizioni sanitarie o di sicurezza locali della città di destinazione</strong>.</li>\n<li><strong>Il Rischio Reale</strong>: Un consulente prenota un viaggio per una filiale a Miami; nelle 48 ore precedenti la partenza, scatta un lockdown sanitario o una crisi epidemiologica con quarantena obbligatoria. L'azienda rischia spese mediche impreviste, controversie legali e l'isolamento forzato del consulente.</li>\n</ul>"}, {"title": "2. L'Architettura di Soluzione: BTP ABAP Environment come Risk Hub", "cleanHtml": "<p class=\"doc-p\">La scomposizione architetturale del microservizio di valutazione del rischio:</p>\n<ul class=\"doc-list\">\n<li><strong>Perché usare SAP BTP, ABAP Environment (Steampunk)</strong>:</li>\n<li>Il team interno di Qitic Inc. possiede un eccellente know-how storico in linguaggio ABAP.</li>\n<li>Sfruttando Steampunk nel cloud, gli sviluppatori possono scrivere codice ABAP moderno e sicuro (Clean Core) senza dover gestire o manutenere un server hardware dedicato.</li>\n<li><strong>Il Flusso Logico a Tre Vie</strong>:</li>\n</ul>\n<ol class=\"doc-steps\">\n<li><em>Acquisizione Dati Sanitari</em>: Chiamata REST outbound periodica verso endpoint pubblici (es. database epidemiologici o API sanitarie governative) per scaricare gli indici di rischio per città e codice postale.</li>\n<li><em>Acquisizione Itinerari</em>: Chiamata protetta da OAuth 2.0 verso le API cloud di SAP Concur per estrarre tutti i viaggi pianificati per i 7 giorni successivi.</li>\n<li><em>Incrocio e Valutazione</em>: L'algoritmo correla la destinazione del viaggio con l'indice sanitario. Se l'indice supera la soglia di tolleranza aziendale (es. 'Alto Rischio'), il sistema contrassegna la trasferta come pericolosa.</li>\n</ol>"}, {"title": "3. Connettività Outbound e Autenticazione con SAP Concur", "cleanHtml": "<p class=\"doc-p\">I dettagli tecnici dell'interscambio con i sistemi cloud Concur:</p>\n<ul class=\"doc-list\">\n<li><strong>SAP Concur Developer Portal</strong>:</li>\n<li>Viene registrata un'applicazione partner ottenendo <em>Client ID</em>, <em>Client Secret</em> e <em>Company Request Token</em>.</li>\n<li><strong>BTP Destination Service</strong>:</li>\n<li>Viene configurata una Destination su BTP che gestisce in autonomia il flusso di token exchange OAuth 2.0, rinnovando automaticamente i token di accesso scaduti.</li>\n<li><strong>Consumo delle API Concur Itinerary</strong>:</li>\n<li>L'applicazione ABAP interroga gli endpoint JSON di Concur estraendo date di arrivo, codici IATA degli aeroporti e indirizzi degli hotel prenotati.</li>\n</ul>"}, {"title": "4. Inoltro Sicuro degli Allarmi tramite SAP Cloud Connector", "cleanHtml": "<p class=\"doc-p\">Risolvere il vincolo dell'invio email da BTP verso l'infrastruttura aziendale:</p>\n<ul class=\"doc-list\">\n<li>In molte aziende enterprise regolamentate, le policy di sicurezza vietano l'invio di email aziendali da server SMTP cloud pubblici generici, per evitare che i messaggi finiscano nelle cartelle di spam o violino la crittografia interna.</li>\n<li><strong>Il Ruolo del Cloud Connector</strong>:</li>\n<li>Nel BTP ABAP Environment, il comando di invio email viene canalizzato attraverso una Destination di tipo <em>OnPremise</em>.</li>\n<li>Il tunnel cifrato del <strong>SAP Cloud Connector</strong> inoltra la chiamata direttamente al server SMTP interno aziendale protetto nella DMZ.</li>\n<li>Il dipendente e il suo manager di progetto ricevono un'email certificata e firmata digitalmente con l'avviso di pericolo, l'indicazione delle restrizioni di quarantena attive e il consiglio formale di convertire le attività on-site in sessioni di lavoro remoto via Microsoft Teams.</li>\n</ul>"}, {"title": "5. Automazione del Processo: Background Daemon e Scheduling", "cleanHtml": "<p class=\"doc-p\">Zero intervento umano per una sorveglianza attiva 24 ore su 24:</p>\n<ul class=\"doc-list\">\n<li>L'esecuzione non richiede che un operatore prema un pulsante: all'interno del runtime Steampunk viene schedulato un <strong>Application Job</strong> automatico che gira ogni notte alle 02:00.</li>\n<li>Il job analizza la finestra temporale dei viaggi dei successivi 14 giorni. Se un'area precedentemente sicura diventa 'zona rossa', l'allarme scatta immediatamente anche se il viaggio era stato approvato 2 mesi prima.</li>\n</ul>"}, {"title": "6. Valore di Business e Benefici Strategici per Qitic Inc.", "cleanHtml": "<p class=\"doc-p\">I risultati concreti dimostrati dall'implementazione:</p>\n<ul class=\"doc-list\">\n<li><strong>Conformità Assoluta al Duty of Care</strong>: L'azienda può certificare agli auditor legali e assicurativi di aver monitorato attivamente ogni singola trasferta contro i database sanitari ufficiali.</li>\n<li><strong>Tutela della Salute dei Lavoratori</strong>: Azzeramento dei casi di dipendenti bloccati in quarantene estere impreviste.</li>\n<li><strong>Risparmio Economico sui Biglietti</strong>: Cancellazione tempestiva delle prenotazioni aeree e alberghiere prima che scattassero le penali di cancellazione dell'ultimo minuto.</li>\n<li><strong>Valorizzazione delle Competenze ABAP</strong>: Dimostrazione pratica che il linguaggio ABAP moderno su BTP è perfettamente in grado di consumare API REST web ed eseguire microservizi cloud-native.</li>\n</ul>"}], "keyDefinitions": [{"term": "Duty of Care", "definition": "Il dovere legale, etico e contrattuale di un'azienda di adottare tutte le misure ragionevoli e necessarie per proteggere la salute, la sicurezza e il benessere dei propri dipendenti durante lo svolgimento delle attività lavorative e delle trasferte."}, {"term": "SAP Concur Travel & Expense", "definition": "Soluzione cloud SaaS leader mondiale per la gestione integrata delle prenotazioni di viaggio (voli, treni, hotel, noleggi) e la rendicontazione e rimborso delle note spese aziendali."}, {"term": "SAP BTP, ABAP Environment (Steampunk)", "definition": "Ambiente runtime PaaS basato su linguaggio ABAP gestito da SAP su hyperscaler, che permette di sviluppare estensioni cloud-native moderne basate su API REST ed HTTP senza infrastruttura on-premise."}, {"term": "Concur Itinerary API", "definition": "Interfaccia API REST fornita da SAP Concur che consente a sistemi esterni autorizzati di estrarre programmaticamente i dettagli completi degli itinerari di viaggio confermati dai dipendenti."}, {"term": "Risk Index (Indice di Rischio Sanitario)", "definition": "Indicatore numerico sintetico calcolato combinando dati epidemiologici esterni (tassi di incidenza, occupazione posti letto ospedalieri, restrizioni di viaggio locali) per quantificare la pericolosità di una destinazione."}, {"term": "Application Job (in ABAP Cloud)", "definition": "Meccanismo standard nel runtime ABAP di BTP per pianificare ed eseguire elaborazioni massive in background a intervalli temporali regolari o a fronte di eventi di sistema."}, {"term": "HTTP Destination Outbound Client", "definition": "Configurazione di rete in BTP che gestisce l'invocazione sicura di servizi esterni su internet (API pubbliche o sistemi partner), gestendo in modo trasparente certificati SSL e credenziali."}, {"term": "Maverick Travel", "definition": "La prenotazione di trasferte aziendali effettuata al di fuori dei canali approvati o in violazione delle policy sanitarie e di sicurezza aziendali."}, {"term": "SMTP Mail Gateway on-premise", "definition": "Server di posta elettronica protetto all'interno della rete locale aziendale utilizzato per inviare comunicazioni ufficiali e certificate evitando filtri antispam."}, {"term": "Auto-Alert Notification", "definition": "Meccanismo automatico che recapita un messaggio critico (via email, SMS o Teams) nel momento esatto in cui un valore di monitoraggio supera una soglia di sicurezza prestabilita."}], "workplaceBestPractices": [{"riskLevel": "CRITICO", "rule": "Includi sempre il monitoraggio del rischio 'Duty of Care' nei progetti di Travel Management", "reason": "integra SAP Concur con feed di rischio esterni per proteggere l'azienda da responsabilità legali e tutelare i lavoratori."}, {"riskLevel": "ALTO", "rule": "Sfrutta SAP BTP, ABAP Environment per sviluppare estensioni cloud se il tuo team ha forti competenze ABAP", "reason": "non serve riqualificare tutti gli sviluppatori su altri linguaggi se possono usare l'ABAP Cloud moderno."}, {"riskLevel": "ALTO", "rule": "Pianifica l'esecuzione dei controlli di rischio come 'Application Job' notturno", "reason": "non limitare il controllo al momento della prenotazione, poiché le condizioni sanitarie o geopolitiche possono degradare dopo l'acquisto del biglietto."}, {"riskLevel": "MEDIO", "rule": "Se l'azienda possiede rigide policy di posta elettronica, usa il Cloud Connector per inoltrare le email attraverso il server SMTP aziendale interno con certificato sicuro invece di usare server di posta cloud generici.", "reason": "Standard architetturale raccomandato da SAP per la stabilità e la sicurezza operativa."}, {"riskLevel": "MEDIO", "rule": "Non limitarti a inviare un avviso al viaggiatore", "reason": "inoltra sempre la notifica di rischio in copia carbone anche al Project Manager responsabile del budget per autorizzare tempestivamente il passaggio del progetto a remoto."}], "quiz": [{"id": 1, "question": "Nel caso d'uso reale di Qitic Inc., quale grave limite operativo di SAP Concur standard viene risolto integrando SAP BTP con i feed di dati sanitari esterni?", "options": ["SAP Concur non permetteva la prenotazione di biglietti aerei in classe economica.", "SAP Concur gestisce ottimamente le policy di spesa e le prenotazioni ma è del tutto privo di dati real-time sulle condizioni epidemiologiche, sanitarie o di sicurezza locali della città di destinazione, esponendo l'azienda a rischi legali e violazioni del Duty of Care.", "SAP Concur ha smesso di supportare le transazioni in dollari statunitensi.", "I dipendenti non potevano utilizzare i propri telefoni cellulari per scattare foto agli scontrini fiscali."], "correctIndex": 1, "explanation": "Concur è un eccellente strumento di spesa e prenotazione ma non possiede informazioni dinamiche sulle emergenze sanitarie o geopolitiche: BTP colma questo gap collegando i dati di viaggio con le API sanitarie esterne per garantire il dovere di protezione (Duty of Care)."}, {"id": 2, "question": "Quale concetto giuridico ed etico impone alle aziende di monitorare attivamente la sicurezza e la salute dei propri dipendenti durante le trasferte di lavoro?", "options": ["Duty of Care.", "Copyright Infringement.", "Creative Commons.", "Open Source Licensing."], "correctIndex": 0, "explanation": "Il 'Duty of Care' (dovere di protezione) è il principio giuridico universale che obbliga il datore di lavoro ad adottare ogni misura ragionevole per salvaguardare la salute, l'incolumità e il benessere dei dipendenti in trasferta."}, {"id": 3, "question": "Quale runtime applicativo di SAP BTP è stato scelto dagli architetti di Qitic Inc. per implementare il microservizio di valutazione del rischio, capitalizzando le competenze interne esistenti?", "options": ["SAP BTP, Neo Environment.", "SAP BTP, ABAP Environment (Steampunk).", "Un server fisico Commodore 64.", "Il browser web Mozilla Firefox."], "correctIndex": 1, "explanation": "Qitic Inc. ha scelto SAP BTP, ABAP Environment (Steampunk): ha permesso al proprio team di sviluppatori ABAP di creare un'estensione cloud-native moderna e conforme al Clean Core senza dover assumere sviluppatori esterni o cambiare stack linguistico."}, {"id": 4, "question": "Attraverso quale meccanismo il microservizio su BTP acquisisce l'elenco dei viaggi programmati dai dipendenti all'interno di SAP Concur?", "options": ["L'amministratore trascrive a mano i dettagli dei viaggi su un foglio di calcolo.", "Vengono invocate le API REST ufficiali di SAP Concur (Itinerary / Travel Booking API) autenticate tramite il protocollo OAuth 2.0 gestito da BTP Destination Service.", "I dipendenti spediscono una cartolina postale prima di recarsi in aeroporto.", "Viene effettuata una ricerca pubblica sui social media per vedere i post dei dipendenti."], "correctIndex": 1, "explanation": "L'applicazione interroga programmaticamente le API REST di SAP Concur: le credenziali OAuth e i token di accesso sono governati in modo sicuro dal Destination Service di BTP, estraendo date, aeroporti e hotel dei viaggiatori."}, {"id": 5, "question": "Perché l'applicazione su BTP viene eseguita come 'Application Job' schedulato in background ogni notte anziché limitarsi a controllare il rischio solo al momento della prenotazione?", "options": ["Perché i computer aziendali non possono essere utilizzati durante il giorno.", "Perché la situazione sanitaria, epidemiologica o politica di una città può mutare repentinamente nelle settimane che separano la prenotazione del volo dalla partenza effettiva; il controllo periodico intercetta l'insorgere di nuove 'zone rosse'.", "Perché le tariffe dei biglietti aerei aumentano se si eseguono query durante il giorno.", "Perché l'elaborazione notturna azzera il costo delle licenze software."], "correctIndex": 1, "explanation": "La dinamicità del rischio richiede vigilanza continua: un viaggio prenotato due mesi prima per una città sicura può diventare pericoloso 48 ore prima della partenza a causa di un'improvvisa emergenza; il job notturno rileva tempestivamente la variazione."}, {"id": 6, "question": "Quale ruolo svolge 'SAP Cloud Connector' nell'inoltro delle email di allerta sanitaria generate da SAP BTP verso i dipendenti e i manager di Qitic Inc.?", "options": ["Cancella le email dei dipendenti per evitare l'intasamento della casella di posta.", "Consente al microservizio in cloud di inoltrare le comunicazioni di allerta attraverso il server SMTP interno aziendale on-premise nella DMZ, garantendo l'invio da un dominio certificato ed evitando che i messaggi finiscano nello spam.", "Traduce le email in lingua esperanto in modo automatico.", "Stampa le email su una stampante ad aghi situata nella sala relax."], "correctIndex": 1, "explanation": "Attraverso il Cloud Connector, il servizio BTP recapita le email al server SMTP aziendale interno protetto: questo garantisce la massima affidabilità di recapito, la firma digitale aziendale e il rispetto delle rigide policy di posta elettronica aziendali."}, {"id": 7, "question": "Cosa contiene la notifica di allarme inviata automaticamente dal sistema quando un viaggio viene contrassegnato ad 'Alto Rischio'?", "options": ["Un invito a partecipare a una lotteria aziendale.", "L'evidenza dell'indice di rischio aggiornato della destinazione, i dettagli sulle restrizioni sanitarie o di quarantena vigenti e la raccomandazione formale al manager e al consulente di convertire le attività on-site in lavoro da remoto.", "La richiesta di dimissioni immediate del dipendente.", "Il catalogo dei souvenir acquistabili presso l'aeroporto di destinazione."], "correctIndex": 1, "explanation": "La notifica fornisce valore operativo concreto: evidenzia il livello di pericolo, illustra le limitazioni di viaggio in vigore e consiglia al manager di autorizzare immediatamente l'erogazione dei servizi in modalità remota via video-collaborazione."}, {"id": 8, "question": "In termini di conformità alla 'Clean Core Strategy', quale caratteristica rende l'estensione di Qitic Inc. perfettamente conforme agli standard moderni di SAP?", "options": ["L'applicazione è stata sviluppata interamente come estensione Side-by-Side su SAP BTP, senza apportare alcuna modifica al codice sorgente o al database centrale di SAP Concur o dell'ERP.", "L'applicazione ha modificato il codice kernel di SAP Concur per impedire la vendita di biglietti aerei.", "I programmatori hanno disinstallato il compilatore ABAP dal server di produzione.", "Tutti i dati aziendali sono stati esportati su fogli di calcolo non crittografati."], "correctIndex": 0, "explanation": "L'estensione rispetta pienamente il Clean Core: risiede su BTP (Steampunk) e dialoga solo tramite API standard con Concur e il server SMTP, garantendo che gli aggiornamenti di Concur Cloud avvengano senza il minimo impatto."}, {"id": 9, "question": "Quale ulteriore beneficio economico ha conseguito Qitic Inc. grazie all'adozione del sistema di monitoraggio predittivo del rischio dei viaggi?", "options": ["L'azzeramento di tutte le imposte sul reddito d'impresa.", "Il risparmio di migliaia di dollari in penali di cancellazione, consentendo di annullare o riprogrammare voli e hotel prima che scattassero i termini di penale dell'ultimo minuto imposti dalle compagnie aeree.", "La fornitura gratuita di carburante per tutti gli aerei della compagnia.", "La cancellazione automatica dei contratti con i clienti che pagano in ritardo."], "correctIndex": 1, "explanation": "Oltre alla sicurezza umana, c'è un forte ritorno economico: intercettare il deterioramento di una destinazione con giorni di anticipo permette di cancellare o riprogrammare voli e alberghi prima della scadenza delle clausole di non-rimborsabilità."}, {"id": 10, "question": "Cosa dimostra questo use case riguardo all'evoluzione del linguaggio ABAP su SAP BTP (Steampunk)?", "options": ["Che il linguaggio ABAP può essere utilizzato solo per stampare fatture cartacee in bianco e nero.", "Che l'ABAP moderno nel cloud (ABAP for Cloud Development) è perfettamente equipaggiato per operare come runtime moderno, consumare API REST esterne via HTTP, manipolare payload JSON e orchestrare scenari cloud-native nel pieno rispetto del Clean Core.", "Che l'ABAP è stato completamente rimpiazzato dal linguaggio Basic.", "Che per scrivere codice ABAP su BTP è necessario utilizzare un browser web del 1995."], "correctIndex": 1, "explanation": "Questo caso sfata il mito dell'ABAP come linguaggio rigido e confinato al passato: nel runtime BTP Steampunk, ABAP gestisce nativamente chiamate HTTP/REST verso internet, elabora JSON, programma job asincroni e si integra con il cloud moderno."}]}, {"id": 16, "number": "16", "title": "Use Case: Integrating SAP Customer Experience with Qualtrics (X+O Data Closed-Loop)", "shortTitle": "Use Case", "part": "Part III: Real-world Use Cases", "readingTime": "35 min", "roles": ["Customer Experience Architect", "CRM Consultant", "CX Lead Developer", "Data Architect", "Product Manager"], "cleanSummaryHtml": "<p class=\"doc-p\">Il Capitolo 16 illustra la massima espressione del paradigma dell'<strong>Intelligent Enterprise</strong>: la convergenza pratica tra dati operativi (<strong>O-Data</strong>) e dati di esperienza (<strong>X-Data</strong>) per realizzare un'architettura a ciclo chiuso (<strong>Closed-Loop Experience Management</strong>). Attraverso il caso reale di <strong>Teleporter</strong> (innovativa società di ride-sharing e mobilità urbana con sede in California), il capitolo mostra come salvare le relazioni con i clienti e prevenire l'abbandono (<em>Customer Churn</em>) prima che sia troppo tardi.</p>\n<p class=\"doc-p\">Nel business B2C ad altissima concorrenza, i clienti insoddisfatti non protestano: cambiano fornitore con un semplice tocco sullo smartphone. Monitorare solo i dati transazionali (O-Data: corse effettuate, pagamenti) segnala il calo delle vendite quando il cliente se n'è già andato. L'integrazione di <strong>Qualtrics CustomerXM</strong> con <strong>SAP Customer Experience (SAP Service Cloud)</strong> orchestrata tramite <strong>SAP BTP</strong> realizza un motore reattivo istantaneo: non appena un utente rilascia un feedback negativo a fine corsa, un webhook su BTP elabora il sentiment con <strong>SAP CAP</strong>, correla lo storico transazionale su <strong>SAP HANA Cloud</strong>, genera automaticamente un ticket di assistenza ad alta priorità nel CRM e recapita un'azione riparatrice al cliente (es. scuse e voucher) in meno di 15 minuti.</p>", "figures": [{"figNumber": "Figura 16.1", "title": "Solution Context Diagram: Caso Teleporter (CX & Qualtrics Closed-Loop)", "image": "images/16_001.png", "explanation": "Scenario della società di ridesharing Teleporter: perdita invisibile di clienti (Customer Churn) a causa di disservizi non tracciati dai soli dati contabili (O-Data)."}, {"figNumber": "Figura 16.3", "title": "Solution Concept Diagram: Closed-Loop Experience Management", "image": "images/16_003.png", "explanation": "L'unione di X-Data e O-Data: il feedback negativo raccolto da Qualtrics (sentiment analysis) scatena un webhook che un microservizio CAP su BTP arricchisce con il valore storico del cliente da HANA Cloud, aprendo un ticket prioritario in SAP Service Cloud."}, {"figNumber": "Figura 16.4", "title": "Solution Realization Diagram di Teleporter", "image": "images/16_004.png", "explanation": "Blueprint end-to-end: Qualtrics Action Engine, SAP Cloud Integration iFlow di mediazione, backend CAP di enrichment e creazione automatica di un voucher di scuse nell'app mobile del passeggero."}], "architectureDiagram": "\n┌────────────────────────────────────────────────────────────────────────────────────────┐\n│                        CLOSED-LOOP X+O DATA ARCHITECTURE (TELEPORTER)                  │\n├────────────────────────────────────────────────────────────────────────────────────────┤\n│ 1. EXPERIENCE CAPTURE LAYER: QUALTRICS CUSTOMERXM (X-DATA: WHY IT HAPPENED)            │\n│    • In-App Post-Ride Micro-Survey (Rating 1-5 Stars, Text Comment)                    │\n│    • Qualtrics Text iQ / Sentiment Analysis: Detects Negativity & Churn Risk           │\n│    • Qualtrics Action Engine: Webhook trigger when Rating <= 2 stars                   │\n├────────────────────────────────────────────────────────────────────────────────────────┤\n│ 2. CLOSED-LOOP ORCHESTRATION & CORRELATION HUB (SAP BTP)                               │\n│    ┌────────────────────────────────────────────────────────────────────────────────┐  │\n│    │ SAP CAP SERVICE (Node.js on Cloud Foundry)                                     │  │\n│    │  • Receives Qualtrics Event Webhook     • Sentiment Severity Assessor          │  │\n│    │  • Enriches X-Data with Customer O-Data • Compensatory Action Logic Engine     │  │\n│    ├────────────────────────────────────────────────────────────────────────────────┤  │\n│    │ SAP HANA CLOUD: Unified Customer Master (Loyalty Tier, Lifetime Value, Rides)  │  │\n│    └──────────────────────┬─────────────────────────────────┬───────────────────────┘  │\n│                           │                                 │                          │\n├───────────────────────────┼─────────────────────────────────┼──────────────────────────┤\n│ 3. OPERATIONAL ACTION     ▼                                 ▼ 4. INSTANT REPARATION   │\n│    ┌──────────────────────────────────────┐   ┌─────────────────────────────────────┐  │\n│    │ SAP SERVICE CLOUD (SAP CX)           │   │ REAL-TIME NOTIFICATION SERVICE      │  │\n│    │ • Auto-creates High Priority Ticket  │   │ • Push Notification / SMS to User   │  │\n│    │ • 15-Minute Response SLA for Support │   │ • Automatic 20% Discount Promo Code │  │\n│    └──────────────────────────────────────┘   └─────────────────────────────────────┘  │\n└────────────────────────────────────────────────────────────────────────────────────────┘\n    ", "coreTopics": [{"title": "1. Il Contesto di Business: La Sfida di Teleporter e il Churn", "cleanHtml": "<p class=\"doc-p\">La spietata concorrenza nella Gig Economy e nei servizi su abbonamento:</p>\n<ul class=\"doc-list\">\n<li><strong>Lo Scenario</strong>: Teleporter è una società californiana che offre servizi di ride-sharing urbano tramite app mobile. Il mercato è dominato da giganti concorrenti e la fedeltà dell'utente è fragile.</li>\n<li><strong>Il Problema dell'O-Data Puro</strong>:</li>\n<li>I sistemi transazionali registrano che il passeggero ha completato la corsa e pagato 24.50$. Dal punto di vista dell'ERP e del database transazionale (<strong>O-Data</strong>), la transazione è perfetta e completata con successo!</li>\n<li>Tuttavia, l'autista è arrivato con 15 minuti di ritardo, ha guidato in modo spericolato e il veicolo era maleodorante.</li>\n<li>L'O-Data è cieco di fronte a questo: registra una vendita, ma non sa che il passeggero ha disinstallato l'applicazione subito dopo essere sceso dall'auto!</li>\n<li><strong>La Necessità di Catturare l'X-Data</strong>: Comprendere l'esperienza soggettiva (<em>Why it happened</em>) e reagire prima che il cliente passi alla concorrenza.</li>\n</ul>"}, {"title": "2. L'Architettura 'Closed-Loop Experience Management'", "cleanHtml": "<p class=\"doc-p\">Cosa distingue un'azienda reattiva da una che raccoglie solo sondaggi passivi:</p>\n<ul class=\"doc-list\">\n<li><strong>Open-Loop (Sondaggi Tradizionali)</strong>: L'azienda invia un questionario via email ogni 6 mesi, accumula grafici con punteggi medi di soddisfazione e pubblica un report che i dirigenti leggono mesi dopo. Nessun cliente scontento viene mai ricontattato.</li>\n<li><strong>Closed-Loop (Ciclo Chiuso Intelligente)</strong>:</li>\n</ul>\n<ol class=\"doc-steps\">\n<li><em>Ascolto nel Momento della Verità (Moment of Truth)</em>: Il sondaggio Qualtrics scatta immediatamente sull'app al termine della corsa.</li>\n<li><em>Analisi Cognitiva del Sentiment</em>: <strong>Qualtrics Text iQ</strong> analizza il testo libero scritto dal passeggero ('autista aggressivo', 'veicolo sporco') identificando emozioni e severità.</li>\n<li><em>Innesco Real-Time</em>: Se il punteggio è critico, Qualtrics innesca un webhook HTTP verso <strong>SAP BTP</strong>.</li>\n<li><em>Azione Correttiva Operativa</em>: BTP correla il feedback con lo storico del cliente e apre automaticamente un ticket di assistenza in <strong>SAP Service Cloud</strong>, assegnando al contempo un buono sconto riparatore.</li>\n</ol>"}, {"title": "3. Il Ruolo di SAP BTP come Correlation Engine (X + O)", "cleanHtml": "<p class=\"doc-p\">Come il servizio SAP CAP combina i due mondi di dati:</p>\n<ul class=\"doc-list\">\n<li>Quando il webhook Qualtrics arriva a BTP, trasporta solo dati qualitativi (<strong>X-Data</strong>): Rating = 1 stella, Commento = 'Ritardo inaccettabile', CustomerID = 88492.</li>\n<li><strong>L'Arricchimento su SAP HANA Cloud (O-Data)</strong>:</li>\n<li>Il microservizio CAP interroga la tabella anagrafica clienti su SAP HANA Cloud:</li>\n<li>Scopre che l'utente '88492' è un cliente VIP di livello 'Diamond', che spende oltre 4.000$ all'anno e compie in media 12 corse al mese.</li>\n<li><strong>Logica di Prioritizzazione Dinamica</strong>:</li>\n<li>Grazie a questa combinazione immediata, BTP non crea un ticket di supporto generico di routine: eleva la severità a 'Critical VIP SLA 15m' e invia una notifica istantanea sul cruscotto dell'operatore di customer care senior.</li>\n</ul>"}, {"title": "4. Integrazione Tecnica con Qualtrics Actions e Webhooks", "cleanHtml": "<p class=\"doc-p\">I dettagli tecnici della connessione guidata dagli eventi:</p>\n<ul class=\"doc-list\">\n<li><strong>Qualtrics Action Engine</strong>:</li>\n<li>Nel pannello di amministrazione di Qualtrics, viene impostata una regola di azione (<em>Action</em>):</li>\n<li><em>Condizione</em>: <code class=\"doc-code\">Q_Score <= 2</code> OR <code class=\"doc-code\">Sentiment == Negative</code>.</li>\n<li><em>Task</em>: Esecuzione di una chiamata REST HTTP POST (Webhook) verso l'URL protetto dell'App Router di SAP BTP.</li>\n<li><strong>Sicurezza e Autenticazione</strong>:</li>\n<li>Il webhook viene autenticato tramite token di sicurezza OAuth 2.0 Client Credentials generato dal servizio XSUAA di BTP, garantendo che nessuna chiamata spuria o malevola possa simulare falsi incidenti.</li>\n</ul>"}, {"title": "5. Creazione Automatica del Ticket in SAP Service Cloud (SAP CX)", "cleanHtml": "<p class=\"doc-p\">Tradurre l'insoddisfazione in un processo operativo di risoluzione formale:</p>\n<ul class=\"doc-list\">\n<li>Il backend CAP su BTP formula una chiamata verso le API OData standard di <strong>SAP Service Cloud</strong>:</li>\n<li>Entità target: <code class=\"doc-code\">ServiceRequestCollection</code>.</li>\n<li>Campi popolati: Oggetto del reclamo, Nome del cliente, Dati dell'autista, ID della corsa, Testo del feedback Qualtrics ed estratto del Sentiment.</li>\n<li>L'operatore del Customer Care riceve il ticket già aperto nella propria console Fiori: non deve chiedere al cliente cosa sia successo (lo sa già!), ma lo contatta telefonicamente entro 15 minuti con parole di scusa mirate e offrendo un credito sul conto aziendale.</li>\n</ul>"}, {"title": "6. Risultati Operativi e Benefici per Teleporter", "cleanHtml": "<p class=\"doc-p\">L'impatto trasformativo sul conto economico dell'azienda:</p>\n<ul class=\"doc-list\">\n<li><strong>Recupero del 72% dei Clienti a Rischio Churn</strong>: Quasi tre quarti dei clienti scontenti che ricevono una chiamata di scusa e un rimborso entro 15 minuti rimangono fedeli alla piattaforma Teleporter.</li>\n<li><strong>Aumento del Net Promoter Score (NPS) Globale di 14 Punti</strong>: I clienti apprezzano enormemente che l'azienda li ascolti in tempo reale anziché ignorare le segnalazioni.</li>\n<li><strong>Miglioramento Continuo della Flotta</strong>: Aggregando i dati di X+O in SAP Analytics Cloud, Teleporter individua gli autisti che generano sistematicamente insoddisfazione, avviando percorsi di formazione mirata o rimuovendoli dalla piattaforma.</li>\n</ul>"}], "keyDefinitions": [{"term": "O-Data (Operational Data)", "definition": "Dati transazionali, contabili e oggettivi che descrivono COSA è accaduto nei sistemi di business (importi pagati, date delle corse, resi merce, anagrafiche) elaborati tipicamente da ERP e CRM."}, {"term": "X-Data (Experience Data)", "definition": "Dati qualitativi, attitudinali e soggettivi che spiegano il PERCHÉ le cose accadono, catturando emozioni, percezioni, aspettative e sentiment dei clienti attraverso piattaforme come Qualtrics."}, {"term": "Closed-Loop Experience Management", "definition": "Approccio operativo avanzato in cui i feedback negativi dei clienti (X-Data) innescano istantaneamente processi operativi automatici (O-Data: ticket di supporto, rimborsi, contatti) per risolvere il problema prima che il cliente abbandoni l'azienda."}, {"term": "Qualtrics CustomerXM", "definition": "Piattaforma di Experience Management leader per il monitoraggio continuo della Customer Experience, dotata di motori di sentiment analysis (Text iQ), calcolo di metriche NPS e trigger di azioni automatiche."}, {"term": "Customer Churn", "definition": "Il tasso o fenomeno di abbandono in cui i clienti cessano di acquistare prodotti o disinstallano l'applicazione di un'azienda passando a fornitori concorrenti."}, {"term": "Net Promoter Score (NPS)", "definition": "Metrica standard internazionale che misura la fedeltà dei clienti attraverso una domanda su scala da 0 a 10 ('Con quale probabilità raccomanderesti questo servizio a un amico?'), classificando gli utenti in Promotori (9-10), Passivi (7-8) e Detrattori (0-6)."}, {"term": "SAP Service Cloud (SAP CX)", "definition": "Soluzione cloud SaaS di SAP per la gestione del customer service, ticketing omnicanale, assistenza tecnica sul campo e risoluzione dei reclami dei clienti conforme a rigidi SLA."}, {"term": "Text iQ (in Qualtrics)", "definition": "Motore di intelligenza artificiale ed elaborazione del linguaggio naturale (NLP) integrato in Qualtrics che analizza automaticamente commenti scritti in testo libero estraendo argomenti chiave e polarità del sentiment (positivo, neutro, negativo)."}, {"term": "Moment of Truth", "definition": "Il momento temporale critico e immediato dell'interazione cliente-azienda (es. la conclusione di una corsa o la ricezione di un pacco) in cui la percezione del servizio si cristallizza e il feedback è massimamente accurato."}, {"term": "Qualtrics Action Engine", "definition": "Modulo di automazione di Qualtrics che ascolta i punteggi e le risposte dei sondaggi in tempo reale ed esegue azioni predefinite come l'invio di notifiche o la chiamata a Webhook esterni su SAP BTP."}], "workplaceBestPractices": [{"riskLevel": "CRITICO", "rule": "Non limitarti a raccogliere sondaggi passivi", "reason": "implementa sempre un'architettura 'Closed-Loop' collegando Qualtrics con SAP Service Cloud tramite SAP BTP per intervenire sui detrattori entro un massimo di 15-30 minuti."}, {"riskLevel": "ALTO", "rule": "Arricchisci sempre l'X-Data con l'O-Data prima di decidere l'azione", "reason": "correla il feedback con il valore del cliente (Customer Lifetime Value) per dare massima priorità ai clienti VIP e strategici per il fatturato."}, {"riskLevel": "ALTO", "rule": "Raccogli il feedback nel 'Moment of Truth'", "reason": "invia micro-sondaggi contestuali subito dopo la conclusione del servizio sull'app mobile anziché inviare lunghe email a freddo giorni dopo, moltiplicherai per 5 il tasso di risposta."}, {"riskLevel": "MEDIO", "rule": "Usa Text iQ per catturare i segnali deboli", "reason": "non analizzare solo i voti da 1 a 5, ma applica l'analisi del sentiment sui commenti scritti per scoprire problemi emergenti (es. difetti ricorrenti di un prodotto) non previsti dalle domande standard."}, {"riskLevel": "MEDIO", "rule": "Proteggi il webhook di ricezione eventi su SAP BTP tramite autenticazione OAuth 2.0 (Client Credentials con XSUAA)", "reason": "non esporre mai endpoint HTTP pubblici senza autenticazione per evitare che bot malevoli inondino il CRM di falsi ticket."}], "quiz": [{"id": 1, "question": "Nel contesto del caso reale di Teleporter, qual è la debolezza fatale insita nel fare affidamento unicamente sui dati operativi tradizionali (O-Data) senza considerare i dati di esperienza (X-Data)?", "options": ["L'O-Data occupa troppo spazio di memoria sui dischi rigidi del data center.", "L'O-Data mostra in modo oggettivo che la transazione commerciale si è conclusa e il pagamento è avvenuto con successo, ma è totalmente 'cieco' rispetto alla frustrazione del cliente (es. autista sgarbato o ritardo), segnalando il problema solo mesi dopo quando il cliente ha già abbandonato la piattaforma (Churn).", "L'O-Data può essere visualizzato solo da computer portatili con schermi a fosfori verdi.", "L'O-Data non permette di calcolare le percentuali di sconto commerciale."], "correctIndex": 1, "explanation": "L'O-Data fotografa il 'COSA' (corsa completata a 24.50$), ma non sa che il cliente è furioso e sta per disinstallare l'app. L'X-Data spiega il 'PERCHÉ' tramite sentiment e rating, consentendo all'azienda di intervenire prima dell'abbandono definitivo."}, {"id": 2, "question": "Cosa si intende per architettura 'Closed-Loop Experience Management' realizzata grazie all'integrazione tra Qualtrics e SAP BTP?", "options": ["Un anello di cavi in fibra ottica posizionato attorno al perimetro dell'edificio aziendale.", "Un sistema in cui i feedback negativi o critici rilasciati dal cliente (X-Data) innescano istantaneamente processi operativi automatici nel CRM (O-Data: creazione ticket ad alta priorità e invio voucher di scuse) per risolvere il problema prima che il cliente cambi fornitore.", "Un modello circolare di turni di lavoro notturni per i dipendenti.", "Un programma per chiudere tutte le applicazioni del computer alle ore 18:00."], "correctIndex": 1, "explanation": "Closed-Loop significa 'chiudere il cerchio': l'esperienza negativa rilevata da Qualtrics non rimane una sterile statistica su un grafico, ma diventa un'azione immediata di riparazione gestita dal customer care attraverso SAP BTP."}, {"id": 3, "question": "Quando l'evento di un feedback fortemente negativo (1 stella su 5) viene inviato da Qualtrics a SAP BTP, quale operazione decisiva compie il microservizio SAP CAP interrogando SAP HANA Cloud?", "options": ["Cancella l'account del cliente dal database per evitare ulteriori lamentele.", "Arricchisce l'X-Data con l'O-Data storico del cliente: verifica se l'utente è un cliente abituale o VIP ad alto valore contrattuale, elevando dinamicamente la priorità del ticket di assistenza nel CRM e riducendo il tempo di risposta garantito (SLA).", "Invia una lettera cartacea di ringraziamento all'autista della vettura.", "Disattiva l'aria condizionata all'interno del data center."], "correctIndex": 1, "explanation": "BTP correla X con O: incrociando il commento furente con lo storico del cliente (es. cliente Diamond da 4.000$ l'anno), il sistema capisce che si tratta di un rischio di perdita gravissimo ed eleva la priorità dell'intervento di soccorso a 'Critica'."}, {"id": 4, "question": "Quale motore di intelligenza artificiale integrato in Qualtrics consente di identificare automaticamente il tono emotivo negativo e i temi ricorrenti analizzando i commenti scritti in testo libero dagli utenti?", "options": ["Qualtrics Text iQ.", "Il correttore ortografico di Microsoft Word 97.", "Il generatore di numeri casuali di sistema.", "Un lettore ottico di schede perforate."], "correctIndex": 0, "explanation": "Text iQ è il motore NLP avanzato di Qualtrics: legge i testi liberi digitati dai clienti e assegna punteggi di sentiment (positivo, neutro, negativo), isolando concetti chiave come 'ritardo', 'sporcizia' o 'comportamento aggressivo'."}, {"id": 5, "question": "Attraverso quale meccanismo tecnico Qualtrics invia la notifica istantanea del feedback critico verso l'applicazione residente su SAP BTP?", "options": ["Tramite l'invio di un fax telematico ogni lunedì mattina.", "Attraverso una chiamata REST HTTP POST (Webhook) innescata dal Qualtrics Action Engine e protetta da token di autenticazione OAuth 2.0 rilasciato dal servizio XSUAA di BTP.", "Mediante un segnale ottico riflesso su specchi parabolici.", "Tramite un file di testo salvato su una chiavetta USB spedita a mano."], "correctIndex": 1, "explanation": "Qualtrics Action Engine scatena un Webhook HTTP in tempo reale verso l'App Router di BTP: la chiamata è resa totalmente sicura da token OAuth 2.0 firmati da XSUAA, garantendo che solo Qualtrics possa innescare azioni nel sistema aziendale."}, {"id": 6, "question": "Quale applicazione cloud dell'Intelligent Suite di SAP riceve la chiamata da BTP per la presa in carico formale del disservizio da parte degli operatori del Customer Care?", "options": ["SAP Service Cloud (all'interno del portafoglio SAP Customer Experience).", "SAP Crystal Reports versione per Windows 98.", "Il gioco del solitario di Windows.", "SAP BTP, Neo Environment."], "correctIndex": 0, "explanation": "SAP Service Cloud (parte di SAP CX) è la piattaforma di gestione del supporto: riceve da BTP tutti i dettagli (corsa, autista, commento Qualtrics e livello cliente), aprendo il ticket sulla scrivania dell'operatore con un rigoroso SLA di contatto."}, {"id": 7, "question": "Che cos'è il 'Net Promoter Score' (NPS) calcolato da Qualtrics e in quale categoria viene inserito un utente che assegna un voto compreso tra 0 e 6?", "options": ["Un parametro per misurare la velocità delle linee internet; l'utente è un 'Navigatore rapido'.", "Una metrica standard internazionale di fedeltà del cliente; l'utente con voto da 0 a 6 viene classificato come 'Detrattore' (persona insoddisfatta che può danneggiare il brand con passaparola negativo).", "Un codice fiscale provvisorio per acquisti all'estero; l'utente è un 'Non Residente'.", "La misura della temperatura corporea dei passeggeri."], "correctIndex": 1, "explanation": "L'NPS è la metrica regina della Customer Experience: chi vota da 0 a 6 è un 'Detrattore', un cliente insoddisfatto ad alto rischio di abbandono e di recensioni negative, su cui il Closed-Loop di BTP interviene immediatamente."}, {"id": 8, "question": "Perché raccogliere il feedback del cliente nel 'Moment of Truth' (es. subito al termine della corsa sull'app) è immensamente più efficace rispetto all'invio di sondaggi email periodici?", "options": ["Perché i telefoni cellulari consumano meno energia se usati a fine giornata.", "Perché la percezione dell'esperienza e le emozioni sono fresche e vivide nella memoria del cliente, garantendo tassi di risposta molto più alti e consentendo un'azione di recupero immediata prima che la rabbia si cronicizzi.", "Perché la legislazione vieta l'invio di email durante i giorni feriali.", "Perché le email promozionali sono sempre gratuite."], "correctIndex": 1, "explanation": "Il 'Momento della Verità' è cruciale: il cliente ha appena vissuto il disservizio. Chiederglielo subito sull'app porta un tasso di risposta del 40-50% e consente all'azienda di intervenire in 15 minuti, ribaltando un'esperienza disastrosa in fidelizzazione duratura."}, {"id": 9, "question": "Quale azione automatica compensatoria (Instant Reparation) viene recapitata al passeggero di Teleporter tramite BTP mentre l'operatore del Customer Care prende in carico il ticket?", "options": ["La cancellazione della carta di credito del cliente.", "Un messaggio push/SMS di scuse immediate corredato da un voucher sconto del 20% applicato automaticamente sulla corsa successiva per disinnescare la frustrazione.", "L'invio di una fotografia della sede centrale dell'azienda.", "La sospensione a tempo indeterminato dell'account utente."], "correctIndex": 1, "explanation": "L'Instant Reparation agisce istantaneamente sul piano emotivo: prima ancora che l'operatore chiami, l'app notifica le scuse con un coupon sconto sulla prossima corsa, dimostrando al cliente che l'azienda ha a cuore la sua soddisfazione."}, {"id": 10, "question": "Quale risultato eccezionale ha raggiunto Teleporter in termini di fidelizzazione (Customer Retention) grazie a questa soluzione integrata su SAP BTP?", "options": ["Tutti i dipendenti dell'azienda hanno rassegnato le dimissioni.", "Il recupero di oltre il 70% dei clienti a rischio abbandono e un incremento di 14 punti nel Net Promoter Score (NPS) complessivo dell'azienda.", "La chiusura definitiva di tutti i canali telefonici di assistenza.", "L'azzeramento totale delle tariffe per tutte le corse della flotta."], "correctIndex": 1, "explanation": "I numeri dimostrano il ROI impressionante dell'architettura Closed-Loop: intervenire tempestivamente recupera più del 70% dei clienti scontenti che altrimenti sarebbero passati alla concorrenza, migliorando drasticamente l'NPS complessivo del brand."}]}, {"id": 17, "number": "17", "title": "Use Case: Building Multitenant Applications Using CAP and SAP BTP, ABAP Environment", "shortTitle": "Use Case", "part": "Part III: Real-world Use Cases", "readingTime": "40 min", "roles": ["SaaS Solution Architect", "BTP Lead Developer", "Cloud Security Specialist", "ABAP Cloud Developer", "DevOps Engineer"], "cleanSummaryHtml": "<p class=\"doc-p\">Nel capitolo 17 viene affrontato il caso aziendale di <strong>Nutri-formance</strong>, fornitore di consulenza nutrizionale e piani dietetici per atleti e organizzazioni sportive d'élite (come i Golden State Warriors e i Chicago Bulls). L'obiettivo strategico di Nutri-formance è distribuire un'unica soluzione Software-as-a-Service (SaaS) scalabile a decine di organizzazioni clienti indipendenti, garantendo la totale segregazione dei dati clinico-prestazionali degli atleti, percorsi di accesso URL dedicati per ciascun team cliente e una gestione industrializzata del ciclo di vita dei tenant (onboarding, upgrade del data model, offboarding).</p>\n<p class=\"doc-p\">Il capitolo illustra i cardini architetturali del multitenancy su SAP BTP:</p>\n<ol class=\"doc-steps\">\n<li><strong>I 3 Principi Cardine del Multitenancy</strong>: <em>Tenant Awareness</em> (capacità dell'applicazione di riconoscere l'identità del cliente chiamante tramite sottodomini personalizzati e token JWT del subaccount consumer), <em>Data Isolation</em> (valutazione tecnica tra Column Discriminator, isolamento logico a schemi dedicati con HDI container via SAP Service Manager, e database fisici separati), e <em>Connectivity Isolation</em> (configurazioni e credenziali di destinazione e connettività on-premise indipendenti per tenant).</li>\n<li><strong>Implementazione Multitenant con SAP CAP</strong>: adozione del modulo <code class=\"doc-code\">@sap/cds-mtx</code> (o MTXS), impostazione del parametro <code class=\"doc-code\">cds.requires.multitenancy = true</code>, binding con i servizi <strong>SaaS Provisioning Service</strong> (<code class=\"doc-code\">saas-registry</code>) e <strong>SAP Service Manager</strong> (<code class=\"doc-code\">service-manager</code>) per la creazione e distruzione automatizzata di container SAP HANA HDI dedicati a runtime per ciascun tenant.</li>\n<li><strong>Ciclo di Vita e Callback di Provisioning</strong>: gestione programmatica dei callback REST obbligatori <code class=\"doc-code\">getDependencies</code> (per le dipendenze dai servizi riusabili di piattaforma) e <code class=\"doc-code\">onSubscription</code> (invocato via PUT per l'onboarding e via DELETE per l'offboarding pulito dei container e delle autorizzazioni).</li>\n<li><strong>Configurazione di Sicurezza e Routing</strong>: configurazione dell'App Router con la variabile <code class=\"doc-code\">TENANT_HOST_PATTERN</code> e impostazione della modalità di sicurezza <code class=\"doc-code\">\"tenant-mode\": \"shared\"</code> nel descrittore <code class=\"doc-code\">xs-security.json</code> per abilitare XSUAA a rilasciare token specifici per il subaccount del tenant abbonato.</li>\n<li><strong>Multitenancy in SAP BTP, ABAP Environment (Steampunk)</strong>: l'alternativa basata sul modello client-dependent classico di SAP, con tabelle database obbligatoriamente profilate per <code class=\"doc-code\">client</code>/<code class=\"doc-code\">mandt</code>, rigida disciplina di delivery classes (<code class=\"doc-code\">C</code> per Customizing, <code class=\"doc-code\">A</code> per Dati Applicativi, <code class=\"doc-code\">L</code> per Buffer Temporanei), prevenzione del cross-client leakage e governance centralizzata del parco tenant tramite il <strong>SAP Landscape Portal</strong>.</li>\n</ol>", "figures": [{"figNumber": "Figura 17.1", "title": "Opzioni di Separazione dei Dati nelle Applicazioni Multitenant", "image": "images/17_001.png", "explanation": "Valutazione comparativa dei tre modelli di isolamento dati: Column Discriminator (stesso schema, rischioso), Schema Separation con HDI Container dedicati (gold standard SAP BTP), e Database fisici separati (costoso)."}, {"figNumber": "Figura 17.2", "title": "SAP SaaS Provisioning Service (saas-registry): Gestione Sottoscrizioni", "image": "images/17_002.png", "explanation": "Flusso di sottoscrizione: interazione tra il Provider Subaccount (che ospita il codice e il database centrale) e i Consumer Subaccount dei clienti tramite callback REST di onboarding e offboarding."}, {"figNumber": "Figura 17.4", "title": "Architettura dei Componenti di un'Applicazione Multitenant SAP CAP", "image": "images/17_004.png", "explanation": "Anatomia del backend CAP multitenant: modulo @sap/cds-mtx, interazione con SAP Service Manager per creare container HDI a runtime e binding con l'istanza XSUAA in modalità 'shared'."}, {"figNumber": "Figura 17.13", "title": "SAP Landscape Portal per Applicazioni ABAP Multitenant", "image": "images/17_013.png", "explanation": "Console Fiori per i fornitori SaaS su SAP BTP, ABAP Environment: monitoraggio dell'intero parco tenant dei clienti, orchestrazione degli upgrade software di release e test di provisioning."}], "architectureDiagram": "+--------------------------------------------------------------------------------------------------+\n|                            ARCHITETTURA SAAS MULTITENANT SU SAP BTP                              |\n+--------------------------------------------------------------------------------------------------+\n\n   [ CONSUMER SUBACCOUNT A (Warriors) ]                 [ CONSUMER SUBACCOUNT B (Bulls) ]\n   URL: https://warriors-nutri.cfapps.eu10.hana.ondemand.com   URL: https://bulls-nutri.cfapps.eu10.hana.ondemand.com\n                   \\                                                     /\n                    \\                                                   /\n   ==================\\=================================================/============================\n   PROVIDER SUBACCOUNT (Nutri-formance SaaS Core Platform)\n   -------------------------------------------------------------------------------------------------\n   [ SAP App Router ] <--- Configurato con TENANT_HOST_PATTERN: \"^(.*)-nutri\\.(.*)\"\n          |\n          | Estrae il sottodominio ('warriors' o 'bulls') e redirige a XSUAA\n          v\n   [ SAP BTP XSUAA ] <--- Configurato con \"tenant-mode\": \"shared\"\n          |\n          | Autentica l'utente nel relativo subaccount consumer e genera JWT con 'zid' (Tenant GUID)\n          v\n   [ Nutri-formance CAP Application (Node.js/Java Backend) ]\n          |\n          +---> [ SaaS Provisioning Service (saas-registry) ]\n          |        | Onboarding: Subaccount Consumer clicca \"Subscribe\" nel BTP Cockpit\n          |        | Esegue PUT su /mtx/v1/provisioning/tenant/<id> (onSubscription Callback)\n          |        | Offboarding: Subaccount Consumer clicca \"Unsubscribe\" -> Esegue DELETE\n          |\n          +---> [ SAP Service Manager (service-manager) ]\n                   | Riceve la richiesta da @sap/cds-mtx e alloca dinamicamente le credenziali HDI\n                   v\n   [ SAP HANA Cloud Database ]\n          +--- [ HDI Container Tenant A (Warriors Data) ]  --> Schema HANA isolato e crittografato\n          +--- [ HDI Container Tenant B (Bulls Data) ]     --> Schema HANA isolato e crittografato\n          +--- [ HDI Container Provider (Shared Metadata) ] --> Template DDL e metadati comuni\n   -------------------------------------------------------------------------------------------------\n   VARIANTE ABAP ENVIRONMENT (Steampunk Multitenancy):\n   [ SAP BTP ABAP Environment System ]  --> Tabelle Client-Dependent (Campo 'mandt' obbligatorio)\n   [ SAP Landscape Portal ]             --> Cruscotto Fiori per Upgrade, Restore e Gestione Tenant\n   =================================================================================================", "coreTopics": [{"title": "I 3 Principi Fondamentali del SaaS Multitenancy", "cleanHtml": "<p class=\"doc-p\">Una vera applicazione multitenant su SAP BTP differisce radicalmente da un'applicazione a singolo tenant per tre fattori strutturali:</p>\n<ol class=\"doc-steps\">\n<li><strong>Tenant Awareness</strong>: Il software deve riconoscere istantaneamente l'identità del cliente chiamante. Questo avviene combinando il routing basato sul sottodominio (es. <code class=\"doc-code\">cliente1-app.domain.com</code>) con il claim <code class=\"doc-code\">zid</code> (Zone ID / Subaccount GUID) validato all'interno del token JWT da XSUAA.</li>\n<li><strong>Data Isolation</strong>: I dati aziendali devono essere rigorosamente segregati. Si valutano tre approcci: (a) <em>Column Discriminator</em> (stesso database e stesso schema con colonna <code class=\"doc-code\">TENANT_ID</code>: altamente sconsigliato per dati sensibili a causa del rischio di query errate); (b) <em>Schema Separation</em> (uno schema HANA / HDI container isolato per tenant: il gold standard su BTP, supportato nativamente da CAP MTX); (c) <em>Separate Database Instances</em> (un'istanza DB fisica per tenant: massima segregazione ma costi proibitivi e complessità operativa).</li>\n<li><strong>Connectivity Isolation</strong>: Ogni tenant deve poter configurare le proprie destinazioni di rete e credenziali verso i propri sistemi on-premise (via Cloud Connector dedicati) o cloud terzi senza interferire con gli altri abbonati.</li>\n</ol>"}, {"title": "Architettura Provider Subaccount vs Consumer Subaccounts", "cleanHtml": "<p class=\"doc-p\">Il modello SaaS su SAP BTP si fonda sulla netta separazione delle responsabilità tra chi sviluppa il software e chi lo consuma:</p>\n<ul class=\"doc-list\">\n<li><strong>Provider Subaccount</strong>: Appartiene al fornitore SaaS (es. Nutri-formance). Ospita il codice sorgente distribuito dell'applicazione (App Router, Backend CAP, Microservizi), le istanze dei servizi di piattaforma (<code class=\"doc-code\">saas-registry</code>, <code class=\"doc-code\">service-manager</code>, <code class=\"doc-code\">xsuaa</code>), e il database SAP HANA Cloud centrale.</li>\n<li><strong>Consumer Subaccount</strong>: Appartiene al cliente finale o a una legal entity aziendale autonoma (es. Golden State Warriors). L'amministratore del consumer non effettua il deploy del codice, ma si limita ad accedere alla sezione 'Instances and Subscriptions' del BTP Cockpit e attivare la sottoscrizione (Subscribe). Il consumo di licenze, la federazione dell'identità (Identity Authentication Service aziendale) e le configurazioni di business rimangono circoscritte al subaccount consumer.</li>\n</ul>"}, {"title": "SAP SaaS Provisioning Service (saas-registry) e Callback Lifecycle", "cleanHtml": "<p class=\"doc-p\">Il servizio <strong>SaaS Provisioning Service</strong> (<code class=\"doc-code\">saas-registry</code>, piano <code class=\"doc-code\">application</code>) è l'orchestratore di BTP che gestisce l'intero ciclo di vita delle sottoscrizioni SaaS. Per abilitare l'automazione, l'applicazione backend deve esporre due endpoint di callback standard:</p>\n<ul class=\"doc-list\">\n<li><strong><code class=\"doc-code\">getDependencies</code></strong>: Restituisce a BTP l'elenco di tutte le istanze di servizi riusabili (come SAP Launchpad Service, Portal o Business Rules) da cui l'applicazione dipende, affinché BTP possa autorizzare il subaccount consumer ad accedere a tali risorse condivise.</li>\n<li><strong><code class=\"doc-code\">onSubscription</code></strong>: Callback invocato automaticamente da BTP quando un cliente effettua la sottoscrizione (richiesta HTTP PUT) o la disiscrizione (richiesta HTTP DELETE). Durante la PUT di onboarding, l'applicazione riceve il tenant ID e il subdomain, avvia il provisioning dello schema database dedicato e compila i dati di configurazione iniziale. Durante la DELETE di offboarding, dealloca le risorse e distrugge lo schema per conformità GDPR/data privacy.</li>\n</ul>"}, {"title": "SAP CAP Multitenancy: @sap/cds-mtx e SAP Service Manager", "cleanHtml": "<p class=\"doc-p\">Nel framework <strong>SAP Cloud Application Programming Model (CAP)</strong>, il multitenancy è integrato in modo dichiarativo e modulare:</p>\n<ul class=\"doc-list\">\n<li>Si abilita nel file <code class=\"doc-code\">package.json</code> impostando <code class=\"doc-code\">\"cds\": { \"requires\": { \"multitenancy\": true } }</code> e installando il pacchetto ufficiale <code class=\"doc-code\">@sap/cds-mtx</code> (o l'evoluzione <code class=\"doc-code\">@sap/cds-mtxs</code>).</li>\n<li>In fase di avvio, CAP espone automaticamente le API standard del protocollo di provisioning SaaS (<code class=\"doc-code\">/mtx/v1/provisioning/...</code>).</li>\n<li>Quando arriva la richiesta di creazione tenant, il layer MTX invoca l'istanza del servizio <strong>SAP Service Manager</strong> (<code class=\"doc-code\">service-manager</code>, piano <code class=\"doc-code\">container</code>). Il Service Manager contatta l'istanza di SAP HANA Cloud e istanzia a caldo un nuovo <strong>HDI Container</strong> indipendente. Subito dopo, MTX applica le definizioni CDS (Core Data Services) compilate in tabelle DDL e viste SQL, popolando eventuali tabelle di customizing di default (<code class=\"doc-code\">.csv</code> data loads).</li>\n</ul>"}, {"title": "Configurazione di Rete e Sicurezza: App Router e XSUAA Shared Mode", "cleanHtml": "<p class=\"doc-p\">Affinché il routing multitenant funzioni in modo trasparente, sono richiesti due requisiti configurativi inderogabili:</p>\n<ol class=\"doc-steps\">\n<li><strong><code class=\"doc-code\">xs-security.json</code></strong>: L'attributo <code class=\"doc-code\">\"tenant-mode\"</code> dell'istanza XSUAA deve essere tassativamente impostato su <code class=\"doc-code\">\"shared\"</code> (invece di <code class=\"doc-code\">\"dedicated\"</code>). Questo autorizza l'istanza XSUAA residente nel Provider Subaccount a validare token emessi per utenti provenienti da qualsiasi subaccount consumer registrato.</li>\n<li><strong><code class=\"doc-code\">TENANT_HOST_PATTERN</code> nell'App Router</strong>: L'App Router deve intercettare l'URL di ingresso e determinare quale tenant sta effettuando la chiamata. Viene definita una Regular Expression come variabile d'ambiente dell'App Router (es. <code class=\"doc-code\">TENANT_HOST_PATTERN: \"^(.<em>)-nutri\\\\.(.</em>)\"</code>). Quando l'utente naviga su <code class=\"doc-code\">warriors-nutri.cfapps.eu10.hana.ondemand.com</code>, l'App Router estrae <code class=\"doc-code\">warriors</code>, lo risolve tramite il servizio XSUAA che redirige l'utente all'Identity Provider (IdP) federato specifico dei Warriors, e inietta l'identità del tenant nel contesto di sicurezza applicativo.</li>\n</ol>"}, {"title": "Multitenancy in SAP BTP, ABAP Environment (Steampunk) e Landscape Portal", "cleanHtml": "<p class=\"doc-p\">A partire dal rilascio di novembre 2020, anche <strong>SAP BTP, ABAP Environment</strong> supporta nativamente il SaaS multitenant sfruttando l'architettura collaudata del client SAP (Mandant):</p>\n<ul class=\"doc-list\">\n<li><strong>Design delle Tabelle Database</strong>: Tutte le tabelle applicative devono essere <em>client-dependent</em>, ovvero il primo campo della chiave primaria deve essere di tipo <code class=\"doc-code\">mandt</code> / <code class=\"doc-code\">abap.clnt</code>. L'ambiente runtime ABAP gestisce l'isolamento a livello di kernel SQL in modo automatico e non scavalcabile.</li>\n<li><strong>Delivery Classes</strong>: Le tabelle devono essere categorizzate con rigore: classe <code class=\"doc-code\">C</code> per tabelle di customizing e configurazione specifica del tenant, classe <code class=\"doc-code\">A</code> per dati transazionali e master data applicativi, classe <code class=\"doc-code\">L</code> per tabelle temporanee o log.</li>\n<li><strong>SAP Landscape Portal</strong>: È l'applicazione SaaS standard basata su SAP Fiori fornita da SAP a beneficio dei fornitori di software. Tramite il Landscape Portal, il provider può monitorare lo stato di tutti i tenant consumer attivi, effettuare il trigger di operazioni di aggiornamento software e migrazione dati su scala globale, e ripristinare o spostare tenant tra diversi sistemi ABAP.</li>\n</ul>"}], "keyDefinitions": [{"term": "Tenant Awareness", "definition": "Capacità intrinseca di un'applicazione cloud di identificare dinamicamente il tenant chiamante dal dominio HTTP e dal token JWT, instradando le richieste verso il rispettivo contesto logico di sicurezza."}, {"term": "SaaS Provisioning Service (saas-registry)", "definition": "Servizio fondamentale di SAP BTP che gestisce il catalogo delle applicazioni multitenant, monitora le sottoscrizioni nei subaccount consumer e coordina i callback di onboarding/offboarding."}, {"term": "SAP Service Manager (service-manager)", "definition": "Servizio di orchestrazione di SAP BTP che consente di creare, associare e distruggere istanze di servizi (come gli HDI container su SAP HANA Cloud) programmaticamente a runtime per ciascun nuovo tenant."}, {"term": "HDI Container Separation", "definition": "Strategia di isolamento dei dati per il multitenancy su SAP BTP in cui ogni tenant dispone di un proprio schema database isolato (HDI container) all'interno della medesima istanza fisica di SAP HANA Cloud."}, {"term": "@sap/cds-mtx / MTXS", "definition": "Libreria ufficiale del framework SAP CAP che implementa automaticamente le API di provisioning SaaS, la generazione dinamica di tabelle DDL e l'aggiornamento asincrono dei modelli dati su tutti i tenant attivi."}, {"term": "TENANT_HOST_PATTERN", "definition": "Espressione regolare configurata come variabile d'ambiente dell'App Router per estrarre il sottodominio identificativo del tenant dall'URL di richiesta del browser e coordinare il redirect verso XSUAA."}, {"term": "Shared Tenant Mode (xs-security.json)", "definition": "Parametro obbligatorio dell'istanza XSUAA del provider che permette a subaccount consumer multipli di sottoscrivere l'applicazione e rilasciare token JWT validi per i propri utenti."}, {"term": "Client-Dependent Architecture (ABAP)", "definition": "Modello di isolamento dei dati in SAP BTP, ABAP Environment basato sul campo 'mandt', in cui le query ABAP SQL isolano automaticamente i record del tenant attivo a livello di runtime."}, {"term": "SAP Landscape Portal", "definition": "Console Fiori chiavi in mano fornita da SAP BTP per consentire ai fornitori SaaS su ABAP Environment di amministrare, aggiornare, collaudare e gestire il ciclo di vita dei tenant dei propri clienti."}], "workplaceBestPractices": [{"riskLevel": "CRITICO", "rule": "Nelle applicazioni SaaS aziendali critiche su SAP CAP, adotta sempre la separazione a livello di schema HDI tramite SAP Service Manager; evita assolutamente il Column Discriminator, che espone a rischi inaccettabili di data-leakage in caso di bug applicativo o query manuale.", "reason": "Standard architetturale raccomandato da SAP per la stabilità e la sicurezza operativa."}, {"riskLevel": "ALTO", "rule": "Nel file `xs-security.json` verifica che `tenant-mode` sia impostato rigorosamente su `shared`; impostare `dedicated` renderebbe l'applicazione visibile e sottoscrivibile unicamente dall'account del provider, impedendo l'attivazione nei subaccount dei clienti.", "reason": "Standard architetturale raccomandato da SAP per la stabilità e la sicurezza operativa."}, {"riskLevel": "ALTO", "rule": "Automatizza la pipeline di onboarding implementando validazioni robuste nel callback `onSubscription`", "reason": "se la creazione dello schema HDI o il seed dei dati fallisce, restituisci un codice HTTP di errore per evitare che BTP consideri la sottoscrizione attiva ma in stato inconsistente."}, {"riskLevel": "MEDIO", "rule": "Pianifica la gestione degli upgrade del data model tramite il comando `cds deploy --to all`", "reason": "la libreria MTX supporta l'applicazione asincrona e controllata delle migrazioni DDL su centinaia di schemi tenant senza richiedere downtime del servizio globale."}, {"riskLevel": "MEDIO", "rule": "Nel deploy su ABAP Environment Steampunk, non tentare mai di disattivare l'automatic client handling di ABAP SQL (evita l'istruzione `USING CLIENT` salvo casi eccezionali di manutenzione di piattaforma documentata).", "reason": "Standard architetturale raccomandato da SAP per la stabilità e la sicurezza operativa."}, {"riskLevel": "CRITICO", "rule": "Monitora il consumo di memoria complessivo su SAP HANA Cloud", "reason": "la proliferazione di decine o centinaia di HDI container crea overhead di catalogo e connessioni; prevedi script di monitoraggio e cleanup per rimuovere i tenant disattivati o di prova."}], "quiz": [{"id": 1, "question": "Nel contesto del caso reale di Nutri-formance, perché l'approccio di isolamento dati basato su 'Schema Separation' (HDI Container per tenant) è preferibile al 'Column Discriminator'?", "options": ["Perché il Column Discriminator richiede di installare un server fisico dedicato per ciascun cliente.", "Perché lo Schema Separation garantisce la separazione fisica/logica delle tabelle e dei privilegi di accesso in schemi HANA distinti gestiti da Service Manager, azzerando il rischio che un bug nel codice mostri i dati della squadra avversaria, a differenza del Column Discriminator che usa la stessa tabella filtrata solo da clausole WHERE applicative.", "Perché SAP HANA Cloud supporta unicamente lo Schema Separation e non permette la creazione di tabelle con più di due colonne.", "Perché il Column Discriminator consuma dieci volte più memoria RAM rispetto a 100 HDI container."], "correctIndex": 1, "explanation": "Il Column Discriminator memorizza i dati di tutti i clienti nella stessa identica tabella, distinguendoli solo per una colonna ID: una query errata (es. dimenticanza di un filtro WHERE) causerebbe la fuoriuscita catastrofica di dati clinici riservati. Lo Schema Separation con HDI container isola completamente i cataloghi e le autorizzazioni a livello di database."}, {"id": 2, "question": "Quale parametro deve essere obbligatoriamente configurato nel file 'xs-security.json' affinché un'applicazione BTP possa essere distribuita in modalità SaaS multitenant ai subaccount dei clienti?", "options": ["\"tenant-mode\": \"dedicated\"", "\"tenant-mode\": \"shared\"", "\"multitenancy\": \"enabled\"", "\"security-level\": \"high\""], "correctIndex": 1, "explanation": "La proprietà 'tenant-mode': 'shared' autorizza l'istanza XSUAA del provider a consentire la creazione di sottoscrizioni (subscriptions) da parte di subaccount consumer esterni, validando correttamente i relativi token JWT."}, {"id": 3, "question": "A cosa serve la variabile d'ambiente 'TENANT_HOST_PATTERN' configurata nell'App Router di un'applicazione multitenant?", "options": ["Serve per indicare l'indirizzo IP statico del database SAP HANA Cloud.", "Fornisce un'espressione regolare (regex) che permette all'App Router di estrarre dall'URL del browser (es. warriors-nutri.cfapps...) il sottodominio identificativo del tenant, coordinandosi con XSUAA per autenticare l'utente nel corretto subaccount consumer.", "Impedisce ai bot e ai motori di ricerca di indicizzare l'applicazione SaaS.", "Serve per impostare il timeout delle sessioni HTTP degli utenti inattivi."], "correctIndex": 1, "explanation": "L'App Router analizza l'hostname della richiesta HTTP mediante la regex specificata in TENANT_HOST_PATTERN; estraendo il tenant subdomain, determina a quale subaccount consumer appartiene l'utente e lo redirige all'Identity Provider corretto."}, {"id": 4, "question": "Qual è il ruolo del servizio 'SAP SaaS Provisioning Service' (saas-registry) nell'architettura multitenant di SAP BTP?", "options": ["Funziona come compilatore di codice sorgente Java e Node.js nel cloud.", "Gestisce il ciclo di vita delle sottoscrizioni, registrando l'applicazione nel marketplace del BTP Cockpit e invocando i callback applicativi ('getDependencies' e 'onSubscription') quando un consumer sottoscrive o cancella il servizio.", "Sostituisce il database SAP HANA memorizzando i record aziendali in un file Excel protetto da password.", "Serve a calcolare automaticamente le tasse di vendita e l'IVA per i clienti esteri."], "correctIndex": 1, "explanation": "Il SaaS Provisioning Service (saas-registry) è l'intermediario centrale di SAP BTP che notifica l'applicazione backend quando un cliente effettua il subscribe/unsubscribe, coordinando l'onboarding e le dipendenze dai servizi condivisi."}, {"id": 5, "question": "Durante l'onboarding di un nuovo tenant in un'applicazione basata su SAP CAP, come interagiscono il modulo '@sap/cds-mtx' e 'SAP Service Manager'?", "options": ["L'amministratore deve accedere manualmente a SAP HANA Cockpit e creare le tabelle riga per riga.", "Il modulo cds-mtx riceve la richiesta di onboarding dal SaaS Registry e si interfaccia con il Service Manager per creare programmaticamente un nuovo HDI Container su SAP HANA Cloud e distribuire automaticamente il data model CDS compilato.", "Il Service Manager elimina il database precedente e riavvia l'intera macchina virtuale di BTP.", "Il modulo cds-mtx esporta il codice sorgente in formato ZIP e lo invia per email al responsabile IT del cliente."], "correctIndex": 1, "explanation": "La combinazione di @sap/cds-mtx e SAP Service Manager consente l'automazione 'zero-touch': all'arrivo della chiamata di sottoscrizione, viene creato a runtime un HDI Container dedicato e vi vengono dispiegate le tabelle e viste CDS."}, {"id": 6, "question": "Quale callback HTTP viene invocato da SAP BTP quando un subaccount consumer clicca su 'Unsubscribe' per terminare l'abbonamento all'applicazione SaaS?", "options": ["Una richiesta HTTP GET sull'endpoint /admin/restart.", "Una richiesta HTTP DELETE sul callback di provisioning (es. /mtx/v1/provisioning/tenant/<tenantId>), che innesca l'offboarding e l'eliminazione controllata del relativo HDI Container tramite Service Manager.", "Una chiamata RPC binaria verso il sistema operativo Linux dell'host Cloud Foundry.", "Nessun callback: i dati del cliente disiscritto vengono lasciati indefinitamente intatti senza alcuna notifica."], "correctIndex": 1, "explanation": "La disiscrizione innesca una richiesta HTTP DELETE verso il callback di provisioning registrato nel saas-registry, consentendo all'applicazione di deallocare lo schema HDI, rimuovere le credenziali e garantire la conformità alla privacy e al GDPR."}, {"id": 7, "question": "Nel caso di sviluppo multitenant su 'SAP BTP, ABAP Environment' (Steampunk), quale requisito architetturale è indispensabile nella progettazione delle tabelle database applicative?", "options": ["Le tabelle non devono mai avere una chiave primaria.", "Tutte le tabelle devono essere 'client-dependent', ovvero avere come primo campo della chiave primaria il campo 'mandt' (tipo abap.clnt), consentendo al runtime ABAP SQL di applicare automaticamente l'isolamento dei dati per tenant.", "Le tabelle devono essere salvate in formato file di testo CSV su un server FTP.", "È obbligatorio memorizzare tutti i campi di testo in formato Base64 crittografato a 4096 bit."], "correctIndex": 1, "explanation": "In ABAP Cloud, l'isolamento multitenant sfrutta il costrutto fondamentale del 'client' (mandant). Se una tabella include il campo 'mandt' come prima chiave, il kernel ABAP inietta automaticamente il filtro del client della sessione corrente in ogni query SQL, impedendo contaminazioni cross-tenant."}, {"id": 8, "question": "Nello sviluppo multitenant su SAP BTP, ABAP Environment, quali sono le classi di consegna (Delivery Classes) corrette per distinguere configurazioni e transazioni?", "options": ["Classe X per i dati finanziari e Classe Z per i programmi creati dal cliente.", "Classe C per i dati di configurazione/customizing specifici del tenant, Classe A per i dati applicativi transazionali/anagrafici, e Classe L per dati temporanei di lavoro.", "Classe 1 per i file PDF e Classe 2 per le immagini JPG.", "Classe PROD per la produzione e Classe TEST per l'ambiente di collaudo."], "correctIndex": 1, "explanation": "Lo standard SAP prevede: Delivery Class C per dati di Customizing (configurazioni di business), Class A per dati Applicativi (ordini, clienti, atleti), e Class L per dati temporanei/di log (che possono essere svuotati periodicamente)."}, {"id": 9, "question": "Cos'è e a cosa serve il 'SAP Landscape Portal' nel contesto di SAP BTP, ABAP Environment?", "options": ["È un software di fotoritocco 3D per disegnare planimetrie di data center SAP.", "È l'applicazione Fiori standard fornita da SAP ai fornitori SaaS per monitorare i sistemi ABAP, gestire il ciclo di vita dei te
