nant dei propri clienti, eseguire aggiornamenti software di release e testare l'onboarding in modo centralizzato.", "È il portale pubblico in cui i consumatori possono acquistare telefoni cellulari aziendali convenzionati.", "È un plugin di Visual Studio Code per creare temi grafici scuri per l'editor ABAP."], "correctIndex": 1, "explanation": "Il Landscape Portal è la console operativa chiavi in mano per i SaaS provider su BTP ABAP Environment: consente di governare il parco tenant, visualizzare le versioni installate, orchestrare gli aggiornamenti di release e condurre test di provisioning."}, {"id": 10, "question": "Cosa accade sul piano dell'infrastruttura quando il fornitore SaaS Nutri-formance rilascia un aggiornamento del data model CDS con nuovi campi e tabelle tramite il modulo MTX?", "options": ["L'aggiornamento deve essere eseguito cliente per cliente chiedendo loro di riavviare manualmente i loro browser.", "Il provider esegue l'operazione di upgrade (es. via API /mtx/v1/model/upgrade o comandi CLI), e MTX provvede ad applicare in modo asincrono e controllato le modifiche DDL a tutti gli HDI Container dei tenant attivi senza disservizi.", "Tutti i dati storici dei clienti vengono cancellati e le tabelle vengono ricreate vuote da zero.", "L'aggiornamento richiede obbligatoriamente di arrestare l'intera regione SAP BTP per un fine settimana."], "correctIndex": 1, "explanation": "Grazie a @sap/cds-mtx e all'architettura HDI, l'aggiornamento strutturale del modello dati viene distribuito programmaticamente e in modo asincrono attraverso tutti gli schemi dei tenant attivi, mantenendo intatti i dati di business già salvati."}]}, {"id": 18, "number": "18", "title": "Use Case: Building Cloud-Native Applications Using SAP BTP, Kyma Runtime", "shortTitle": "Use Case", "part": "Part III: Real-world Use Cases", "readingTime": "45 min", "roles": ["Cloud-Native Architect", "Kubernetes Engineer", "BTP Platform Engineer", "DevOps & SRE Specialist", "Microservices Developer"], "cleanSummaryHtml": "<p class=\"doc-p\">Nel capitolo finale 18 viene analizzato il caso aziendale ad alta complessità di <strong>Samaritan</strong>, un intermediario logistico internazionale di forniture sanitarie e dispositivi di protezione individuale (DPI, respiratori, mascherine chirurgiche). Durante l'improvvisa crisi pandemica del COVID-19, Samaritan sperimenta oscillazioni di carico vertiginose e imprevedibili, con picchi di migliaia di ordini al minuto provenienti simultaneamente da ospedali, enti governativi e farmacie. L'infrastruttura applicativa convenzionale basata su runtime tradizionali rischia il collasso operativo o costi insostenibili a causa di una scalabilità troppo rigida e lenta.</p>\n<p class=\"doc-p\">Per risolvere questa sfida critica di business, Samaritan implementa una soluzione cloud-native enterprise su <strong>SAP BTP, Kyma runtime</strong>, l'ambiente Kubernetes fully-managed offerto da SAP integrato con <strong>Istio Service Mesh</strong>, carichi a container Docker, package management con <strong>Helm</strong> e funzioni serverless orientate agli eventi.</p>\n<p class=\"doc-p\">Il capitolo sviscera l'intera pipeline di ingegneria del software cloud-native:</p>\n<ol class=\"doc-steps\">\n<li><strong>Scelta Architetturale: Kyma Runtime vs Cloud Foundry</strong>: analisi comparativa rigorosa tra l'approccio PaaS a 12 fattori di Cloud Foundry (rigido, vincolato a buildpack e scaling orizzontale a livello di intere VM) e la libertà architetturale di Kyma (accesso Kubernetes nativo, estendibilità mediante Custom Resource Definitions/CRD, container Docker poliglotti, integrazione serverless a zero-scaling).</li>\n<li><strong>Setup di Piattaforma e Governance RBAC</strong>: attivazione dell'entitlement nel BTP Cockpit ('Enable Kyma'), provisioning del cluster K8s managed, esplorazione della Kyma Dashboard e configurazione dei ruoli di sicurezza granulari (<code class=\"doc-code\">KymaRuntimeNamespaceAdmin</code> per gli amministratori di namespace e <code class=\"doc-code\">KymaRuntimeDeveloper</code> per gli sviluppatori di microservizi).</li>\n<li><strong>Integrazione dei Backing Service tramite SAP BTP Service Operator</strong>: come i container in Kyma consumano in modo nativo i servizi gestiti di BTP (XSUAA, Destination, SAP Event Mesh) trasformando le istanze di piattaforma in Custom Resources Kubernetes e montando credenziali protette (K8s Secrets).</li>\n<li><strong>Deployment e DevOps con Helm e SAP CI/CD</strong>: packaging dei microservizi in chart Helm versionati (<code class=\"doc-code\">deployment.yaml</code>, <code class=\"doc-code\">service.yaml</code>, <code class=\"doc-code\">values.yaml</code>) e orchestrazione di pipeline di Continuous Delivery automatizzate in <strong>SAP CI/CD</strong> per distribuire container su cluster Kyma a ogni release Git.</li>\n<li><strong>Esposizione Sicura dei Servizi con Istio APIRules</strong>: configurazione della risorsa Custom <code class=\"doc-code\">APIRule</code> per esporre le API REST all'esterno del cluster, applicazione di policy di sicurezza OAuth 2.0 e JWT collegate a XSUAA, e federazione dell'interfaccia Fiori su <strong>SAP Launchpad Service / SAP Work Zone</strong>.</li>\n<li><strong>Resilienza e Scalabilità Elastica (HPA)</strong>: gestione delle repliche dei pod e configurazione dell'Horizontal Pod Autoscaler (HPA) per scalare istantaneamente da 1 a decine di pod durante le ondate epidemiche di ordini e rientrare a 1 pod a domanda stabilizzata per azzerare lo spreco di risorse.</li>\n</ol>", "figures": [{"figNumber": "Figura 18.1", "title": "Solution Concept Diagram: Samaritan (Healthcare Logistics su Kyma)", "image": "images/18_001.png", "explanation": "Scenario della pandemia COVID-19: brokeraggio logistico di dispositivi di protezione con picchi improvvisi e massivi di ordini da ospedali, gestito con microservizi containerizzati su Kubernetes."}, {"figNumber": "Figura 18.2", "title": "Solution Realization Diagram su SAP BTP, Kyma Runtime", "image": "images/18_002.png", "explanation": "Blueprint del cluster Kyma: Ingress Gateway Istio, Custom Resource APIRule con sicurezza OAuth 2.0, namespace Kubernetes isolati, pod applicativi e binding dei servizi BTP con il SAP BTP Service Operator."}, {"figNumber": "Figura 18.4", "title": "Kyma Dashboard: Gestione Workload e Risorse Kubernetes", "image": "images/18_004.png", "explanation": "La console visuale di Kyma per monitorare lo stato di salute dei pod, le repliche dei deployment, le Custom Resource Definitions e il consumo di memoria/CPU del cluster."}, {"figNumber": "Figura 18.10", "title": "Configurazione di una APIRule su Istio in Kyma Runtime", "image": "images/18_010.png", "explanation": "Definizione dichiarativa delle regole di routing e delle policy di sicurezza (JWT / OAuth 2.0) all'ingresso del cluster per esporre i microservizi verso SAP Launchpad Service e portali esterni."}], "architectureDiagram": "+--------------------------------------------------------------------------------------------------+\n|                          ARCHITETTURA CLOUD-NATIVE SU SAP BTP, KYMA RUNTIME                      |\n+--------------------------------------------------------------------------------------------------+\n\n   [ Utenti Clinici / Portali Ospedalieri ]       [ SAP Launchpad Service / SAP Work Zone ]\n                    \\                                             /\n                     \\                                           /\n   ===================\\=========================================/===================================\n   SAP BTP, KYMA RUNTIME (Fully Managed Kubernetes Cluster & Istio Service Mesh)\n   -------------------------------------------------------------------------------------------------\n   [ Istio Ingress Gateway ] <--- Punto di ingresso unico HTTPS per il traffico esterno\n          |\n   [ Kyma APIRule (Custom Resource) ]\n          |  * Specifica: host, service name, port\n          |  * Security Policy: OAuth 2.0 / JWT (validazione automatica token XSUAA)\n          v\n   +-- NAMESPACE: 'samaritan-order-management' ----------------------------------------------------+\n   |                                                                                               |\n   |  [ Kubernetes Service (ClusterIP) ]                                                           |\n   |        |                                                                                      |\n   |        +---> [ Pod: Order Microservice (Replica 1) ] \\                                        |\n   |        +---> [ Pod: Order Microservice (Replica 2) ]  |-- Gestiti da Kubernetes Deployment    |\n   |        +---> [ Pod: Order Microservice (Replica N) ] /    & Horizontal Pod Autoscaler (HPA)   |\n   |                                                                                               |\n   |  [ Kyma Serverless Function (Node.js/Python) ] <--- Attivata da Eventi SAP Event Mesh         |\n   |        | Calcola in tempo reale la priorità di allocazione dei respiratori salvavita          |\n   |                                                                                               |\n   |  [ Kubernetes Secrets ] <--- Sincronizzati da SAP BTP Service Operator                        |\n   |        * Credenziali XSUAA per autenticazione JWT                                             |\n   |        * Credenziali Destination Service per connettività ERP                                 |\n   +-----------------------------------------------------------------------------------------------+\n   -------------------------------------------------------------------------------------------------\n   [ SAP BTP BACKING SERVICES & DEVOPS INFRASTRUCTURE ]\n     * SAP Event Mesh: Buffering asincrono dei picchi di ordini per proteggere il database\n     * SAP HANA Cloud: Persistenza transazionale relazionale dei contratti e dello stock\n     * SAP Continuous Integration and Delivery (SAP CI/CD): Build Docker & Helm Deploy automatico\n     * SAP BTP Destination Service: Connettività protetta verso i sistemi logistici partner\n   =================================================================================================", "coreTopics": [{"title": "Kyma Runtime vs Cloud Foundry: Analisi Comparativa Strategica", "cleanHtml": "<p class=\"doc-p\">La scelta tra Cloud Foundry e Kyma runtime rappresenta una delle decisioni architetturali più determinanti su SAP BTP:</p>\n<ul class=\"doc-list\">\n<li><strong>Cloud Foundry</strong>: È un ambiente PaaS opinionated orientato alle applicazioni a 12 fattori. Lo sviluppatore rilascia solo il codice sorgente (Java o Node.js), e i buildpack creano il runtime. Presenta una gestione delle dipendenze di sistema rigida, non supporta container Docker arbitrari, e la scalabilità orizzontale alloca intere copie dell'applicazione con consumi di memoria fissi.</li>\n<li><strong>Kyma Runtime</strong>: È un ambiente cloud-native basato su <strong>Kubernetes</strong> enterprise gestito interamente da SAP, arricchito con <strong>Istio Service Mesh</strong>, componenti open source del progetto Kyma ed estensioni enterprise SAP. Permette di eseguire qualsiasi container Docker (qualsiasi linguaggio, libreria nativa C++, Python per AI/ML), offre supporto per funzioni serverless a basso consumo, scalabilità elastica fulminea (Horizontal Pod Autoscaler) e piena compatibilità con l'ecosistema CNCF (Cloud Native Computing Foundation).</li>\n</ul>"}, {"title": "Provisioning, Architettura del Cluster e Governance RBAC", "cleanHtml": "<p class=\"doc-p\">L'amministrazione del Kyma runtime su SAP BTP è strutturata per combinare la potenza di Kubernetes con la semplicità del cloud gestito:</p>\n<ul class=\"doc-list\">\n<li><strong>Attivazione</strong>: Dal cockpit BTP del subaccount, dopo aver assegnato le quote di entitlement per Kyma, basta premere il pulsante <strong>'Enable Kyma'</strong>. SAP effettua il provisioning trasparente del cluster Kubernetes su hyperscaler (AWS, Azure o GCP) gestendo aggiornamenti del kernel, patch di sicurezza e certificati TLS.</li>\n<li><strong>Kyma Dashboard</strong>: Console web moderna che visualizza carichi di lavoro (Workloads), Pod, Deployment, Servizi, ConfigMap, Secrets e APIRules.</li>\n<li><strong>Modello di Sicurezza RBAC</strong>: La governance degli accessi si basa su Role Collections predefinite associate tramite XSUAA o Identity Authentication Service:</li>\n<li><code class=\"doc-code\">KymaRuntimeNamespaceAdmin</code>: Concede i massimi privilegi di gestione, configurazione delle quote e creazione di APIRule all'interno di uno specifico Namespace.</li>\n<li><code class=\"doc-code\">KymaRuntimeDeveloper</code>: Permette il deploy di applicazioni, la modifica dei pod e la consultazione di log ed eventi nel namespace di competenza, impedendo la modifica delle impostazioni globali del cluster.</li>\n<li><strong>Namespaces</strong>: Consentono di partizionare logicamente il cluster tra team di sviluppo o ambienti di ciclo di vita (es. <code class=\"doc-code\">dev</code>, <code class=\"doc-code\">test</code>, <code class=\"doc-code\">prod</code>), garantendo la separazione di risorse e quote di CPU/RAM.</li>\n</ul>"}, {"title": "SAP BTP Service Operator: Integrazione Nativa dei Backing Services", "cleanHtml": "<p class=\"doc-p\">Uno dei principali vantaggi di Kyma rispetto a un generico cluster Kubernetes esterno è la presenza preconfigurata del <strong>SAP BTP Service Operator</strong>:</p>\n<ul class=\"doc-list\">\n<li>Nativamente, un'applicazione in un container K8s necessita di accedere a servizi gestiti BTP come <strong>XSUAA</strong>, <strong>SAP Destination Service</strong>, <strong>SAP HANA Cloud</strong> o <strong>SAP Event Mesh</strong>.</li>\n<li>Con il BTP Service Operator, lo sviluppatore non deve generare chiavi manuali nel cockpit BTP. Definisce semplicemente dei manifest YAML di tipo <code class=\"doc-code\">ServiceInstance</code> e <code class=\"doc-code\">ServiceBinding</code> conformi alle Custom Resources di Kubernetes.</li>\n<li>L'operatore contatta le API del Service Manager di BTP, effettua il provisioning del servizio e inietta automaticamente le credenziali risultanti all'interno di un <strong>Kubernetes Secret</strong> cifrato nel namespace locale.</li>\n<li>I microservizi montano questo Secret come variabili d'ambiente o come volume su filesystem, simulando con massima eleganza le variabili d'ambiente <code class=\"doc-code\">VCAP_SERVICES</code> tipiche di Cloud Foundry ma in pieno standard cloud-native K8s.</li>\n</ul>"}, {"title": "Ingegneria del Deployment: Helm Charts e SAP Continuous Integration & Delivery", "cleanHtml": "<p class=\"doc-p\">Per evitare deployment manuali frammentari con <code class=\"doc-code\">kubectl apply</code>, le architetture enterprise su Kyma adottano <strong>Helm</strong>, il package manager standard de facto di Kubernetes:</p>\n<ul class=\"doc-list\">\n<li><strong>Struttura di un Helm Chart</strong>: Il chart comprende il descrittore <code class=\"doc-code\">Chart.yaml</code>, il file di parametri <code class=\"doc-code\">values.yaml</code> (in cui si definiscono tag delle immagini Docker, numero di repliche, porte e limiti di risorse), e la cartella <code class=\"doc-code\">templates/</code> contenente i manifest parametrizzati (<code class=\"doc-code\">deployment.yaml</code>, <code class=\"doc-code\">service.yaml</code>, <code class=\"doc-code\">apirule.yaml</code>).</li>\n<li><strong>Automazione CI/CD con SAP Continuous Integration and Delivery</strong>: Il repository Git contenente il codice del microservizio e il chart Helm viene agganciato al servizio <strong>SAP CI/CD</strong> di BTP. La pipeline esegue i test unitari, compila l'immagine Docker, la pubblica su un container registry sicuro e lancia il comando di deploy <code class=\"doc-code\">helm upgrade --install</code> sul cluster Kyma, garantendo rilasci idempotenti, tracciabili e privi di downtime (rolling updates).</li>\n</ul>"}, {"title": "Esposizione e Sicurezza degli Endpoint con Istio ed APIRules", "cleanHtml": "<p class=\"doc-p\">All'interno del cluster Kyma, i microservizi sono isolati dalla rete pubblica e comunicano tra loro all'interno della rete mesh governata da <strong>Istio Service Mesh</strong> via mTLS (mutual TLS automatico):</p>\n<ul class=\"doc-list\">\n<li>Per esporre un microservizio all'esterno (es. verso portali sanitari terzi o verso l'interfaccia Fiori), Kyma fornisce la Custom Resource <strong><code class=\"doc-code\">APIRule</code></strong> (<code class=\"doc-code\">gateway.kyma-project.io/v1alpha1</code>).</li>\n<li>Un <code class=\"doc-code\">APIRule</code> configura automaticamente l'<strong>Istio Ingress Gateway</strong>, definisce l'hostname pubblico FQDN, mappa le porte sul Service K8s e soprattutto applica la policy di sicurezza richiesta.</li>\n<li><strong>Metodi di Autenticazione supportati dall'APIRule</strong>:</li>\n</ul>\n<ol class=\"doc-steps\">\n<li><code class=\"doc-code\">noop</code>: Nessuna autenticazione (usato solo per health check pubblici o endpoint non sensibili);</li>\n<li><code class=\"doc-code\">jwt</code>: Validazione automatica del token Bearer JWT direttamente all'Ingress Gateway mediante verifica delle chiavi JWKS dell'istanza XSUAA/IAS, senza che il microservizio debba implementare codice di validazione crittografica;</li>\n<li><code class=\"doc-code\">oauth2</code>: Flusso con validazione e introspezione dei token OAuth 2.0.</li>\n</ol>\n<ul class=\"doc-list\">\n<li>Configurando un OAuth Client in Kyma e creando una voce nel <strong>SAP BTP Destination Service</strong>, l'applicazione <strong>SAP Launchpad Service</strong> può consumare le API del cluster Kyma come una qualsiasi destinazione HTTP sicura.</li>\n</ul>"}, {"title": "Scalabilità Dinamica ed Elasticità con HPA e Serverless Functions", "cleanHtml": "<p class=\"doc-p\">La gestione dei picchi di traffico eccezionali (come le ondate di ordini di forniture mediche affrontate da Samaritan) sfrutta appieno l'architettura elastica di Kyma:</p>\n<ul class=\"doc-list\">\n<li><strong>Configurazione Replicas e Horizontal Pod Autoscaler (HPA)</strong>: Nel file <code class=\"doc-code\">deployment.yaml</code> o <code class=\"doc-code\">values.yaml</code> del chart Helm, il parametro <code class=\"doc-code\">replicas</code> può essere gestito staticamente o affidato a un manifest HPA (<code class=\"doc-code\">autoscaling/v2</code>). L'HPA monitora continuamente le metriche dei pod (es. utilizzo medio della CPU superiore al 70% o metriche di rete personalizzate) e istanzia automaticamente nuovi pod gemelli in pochi secondi per distribuire il carico.</li>\n<li><strong>Assorbimento dei Picchi con SAP Event Mesh</strong>: Per impedire che i picchi mandino in crash il database SAP HANA Cloud transazionale, gli ordini in ingresso vengono pubblicati come messaggi su code di <strong>SAP Event Mesh</strong>. I microservizi worker o le <strong>Kyma Serverless Functions</strong> (funzioni Node.js o Python event-driven a consumo) prelevano i messaggi dalla coda a ritmo controllato, garantendo throughput massimo e zero perdite di transazioni critiche.</li>\n</ul>"}], "keyDefinitions": [{"term": "SAP BTP, Kyma Runtime", "definition": "Ambiente runtime enterprise basato su Kubernetes fully-managed da SAP, progettato per orchestrare microservizi containerizzati Docker, funzioni serverless ed estensioni cloud-native."}, {"term": "Istio Service Mesh", "definition": "Infrastruttura di rete trasparente integrata in Kyma che gestisce il routing del traffico, la crittografia mTLS automatica tra container, l'osservabilità e la sicurezza a livello di Ingress Gateway."}, {"term": "APIRule (CRD)", "definition": "Custom Resource Definition proprietaria di Kyma che consente di esporre microservizi all'esterno del cluster applicando con poche righe YAML regole di routing e autenticazione JWT o OAuth 2.0."}, {"term": "Helm Chart", "definition": "Pacchetto standard di Kubernetes contenente template YAML parametrizzati e file di configurazione (values.yaml) per automatizzare e versionare il deployment di applicazioni complesse."}, {"term": "SAP BTP Service Operator", "definition": "Componente nativo del cluster Kyma che consente agli sviluppatori di istanziare servizi gestiti BTP (XSUAA, Destination, Event Mesh) tramite manifest K8s, iniettando le credenziali in Secrets locali."}, {"term": "Horizontal Pod Autoscaler (HPA)", "definition": "Meccanismo di Kubernetes che scala automaticamente il numero di repliche di un Pod in risposta a incrementi di utilizzo della CPU, della memoria o di metriche applicative personalizzate."}, {"term": "Kyma Serverless Function", "definition": "Unità di codice compatta (Node.js o Python) eseguita all'interno di Kyma in risposta a eventi HTTP o messaggi provenienti da SAP Event Mesh, ideale per logiche a basso overhead e scaling rapido."}, {"term": "KymaRuntimeNamespaceAdmin", "definition": "Ruolo di sicurezza RBAC su BTP che conferisce i privilegi di amministrazione completa sulle risorse, configurazioni di rete e permessi all'interno di uno specifico Namespace Kyma."}, {"term": "Pod", "definition": "La più piccola unità di calcolo distribuibile in Kubernetes, costituita da uno o più container Docker che condividono storage, rete e specifiche di esecuzione."}, {"term": "Rolling Update", "definition": "Strategia di deployment predefinita di Kubernetes in cui nuove versioni dei container sostituiscono gradualmente le vecchie senza interruzione del servizio per gli utenti finali."}], "workplaceBestPractices": [{"riskLevel": "CRITICO", "rule": "Definisci sempre richieste e limiti di risorse (`resources.requests` e `resources.limits` per CPU e Memoria) per ogni container nei manifest Helm; senza di essi, un microservizio in memory leak potrebbe esaurire le risorse dell'intero nodo K8s provocando il riavvio forzato di altri pod critici.", "reason": "Standard architetturale raccomandato da SAP per la stabilità e la sicurezza operativa."}, {"riskLevel": "ALTO", "rule": "Nelle applicazioni produttive, non esporre mai gli endpoint applicativi tramite APIRule configurate con metodo `noop`; utilizza sempre `jwt` agganciato a XSUAA per garantire che ogni singola chiamata HTTP contenga un token OAuth valido e firmato.", "reason": "Standard architetturale raccomandato da SAP per la stabilità e la sicurezza operativa."}, {"riskLevel": "ALTO", "rule": "Utilizza il SAP BTP Service Operator per gestire il ciclo di vita dei servizi di piattaforma BTP; non inserire mai chiavi di servizio o password statiche nei file di configurazione o nei repository Git.", "reason": "Standard architetturale raccomandato da SAP per la stabilità e la sicurezza operativa."}, {"riskLevel": "MEDIO", "rule": "Implementa sempre controlli di salute robusti (`readinessProbe` e `livenessProbe`) nel template del deployment K8s", "reason": "permettono a Kubernetes di non inviare traffico ai pod che non hanno ancora completato l'inizializzazione e di riavviare tempestivamente i container bloccati in deadlock."}, {"riskLevel": "MEDIO", "rule": "Combina l'autoscaling orizzontale dei pod (HPA) con un'architettura event-driven basata su SAP Event Mesh quando prevedi picchi improvvisi di traffico", "reason": "l'accodamento asincrono protegge il database SAP HANA Cloud da saturazione delle connessioni simultanee."}, {"riskLevel": "CRITICO", "rule": "Organizza il cluster Kyma strutturando namespace separati con quote di risorse distinte per ambienti (`dev`, `test`, `prod`) e assegna i ruoli `KymaRuntimeDeveloper` per limitare il raggio d'azione degli sviluppatori rispetto ai carichi di produzione.", "reason": "Standard architetturale raccomandato da SAP per la stabilità e la sicurezza operativa."}], "quiz": [{"id": 1, "question": "Nel contesto del caso reale di Samaritan, qual è la ragione tecnica primaria che ha guidato la scelta di 'SAP BTP, Kyma runtime' rispetto a 'Cloud Foundry' per la gestione delle forniture mediche durante la pandemia?", "options": ["Perché Cloud Foundry non permette l'utilizzo di alcun database relazionale.", "Perché la natura improvvisa e colossale dei picchi di domanda richiedeva la flessibilità di orchestrare container Docker poliglotti, pacchettizzati con Helm, con scalabilità automatica elastica rapida basata su Kubernetes (HPA) ed elaborazione serverless asincrona basata su eventi.", "Perché Kyma è un software gratuito che non richiede alcuna sottoscrizione o licenza su SAP BTP.", "Perché Cloud Foundry supporta esclusivamente il linguaggio di programmazione COBOL."], "correctIndex": 1, "explanation": "Cloud Foundry è ottimizzato per carichi standard a 12 fattori con buildpack prefissati e scalabilità relativamente lenta. Per fronteggiare picchi pandemici estremi e carichi eterogenei, Kyma offre la piena potenza di Kubernetes nativo, containerizzazione Docker libera, scalabilità istantanea e funzioni serverless orientate agli eventi."}, {"id": 2, "question": "A cosa serve la risorsa Custom 'APIRule' nel runtime SAP BTP, Kyma?", "options": ["Serve a cancellare i file temporanei dai dischi del server ogni notte.", "È una risorsa di Kyma che configura l'Istio Ingress Gateway per esporre un microservizio all'esterno del cluster Kubernetes, permettendo di definire con regole dichiarative le policy di accesso e di sicurezza (come JWT o OAuth 2.0).", "Serve a compilare il codice sorgente ABAP in linguaggio macchina.", "È un foglio di calcolo utilizzato per registrare le presenze orarie degli sviluppatori del team."], "correctIndex": 1, "explanation": "La risorsa APIRule semplifica drasticamente la configurazione di Istio: espone il servizio associandogli un URL pubblico protetto e applica la validazione automatica dei token JWT/OAuth 2.0 direttamente all'ingresso del cluster."}, {"id": 3, "question": "Quale vantaggio fondamentale offre il 'SAP BTP Service Operator' installato nel cluster Kyma agli sviluppatori di microservizi?", "options": ["Permette di creare istanze e associazioni (binding) dei servizi gestiti di SAP BTP (come XSUAA, Destination ed Event Mesh) direttamente tramite manifest Kubernetes (YAML), iniettando automaticamente le credenziali in K8s Secrets.", "Fornisce un'interfaccia grafica per giocare a scacchi durante le build del codice.", "Elimina la necessità di avere un abbonamento a SAP BTP per eseguire i pod.", "Raddoppia automaticamente la velocità della CPU dei server fisici dell'hyperscaler."], "correctIndex": 0, "explanation": "Il SAP BTP Service Operator colma il divario tra Kubernetes e i servizi BTP: consente di dichiarare dipendenze da servizi SAP come risorse K8s native, sincronizzando chiavi e credenziali direttamente in Kubernetes Secrets cifrati."}, {"id": 4, "question": "Quale ruolo di sicurezza (Role Collection) deve essere assegnato a un developer per consentirgli di effettuare il deploy di carichi di lavoro e consultare i log in un determinato namespace di Kyma, senza concedergli i diritti di amministrazione globale del cluster?", "options": ["GlobalAccountAdministrator", "KymaRuntimeDeveloper", "RootAccessMaster", "ClusterHardwareSuperUser"], "correctIndex": 1, "explanation": "Il ruolo 'KymaRuntimeDeveloper' è progettato specificamente per gli sviluppatori: fornisce i permessi necessari per distribuire container, consultare pod e log all'interno del namespace assegnato, senza consentire modifiche strutturali al cluster riservate a 'KymaRuntimeNamespaceAdmin'."}, {"id": 5, "question": "Cos'è 'Helm' e quale ruolo svolge nel ciclo di vita applicativo su SAP BTP, Kyma runtime?", "options": ["È un sistema operativo concorrente di Linux sviluppato da SAP.", "È il package manager standard de facto per Kubernetes, che organizza manifest YAML parametrizzati (Deployment, Service, APIRule) in un unico pacchetto versionato (Chart), facilitando distribuzioni automatizzate e ripetibili via CI/CD.", "È uno strumento hardware per raffreddare a liquido i server dei data center.", "È un'applicazione per smartphone usata per approvare le ferie dei dipendenti."], "correctIndex": 1, "explanation": "Helm permette di trattare un'intera architettura a microservizi come un unico pacchetto versionabile. Attraverso i file Chart.yaml e values.yaml, consente di distribuire o aggiornare l'intera applicazione con un singolo comando o pipeline."}, {"id": 6, "question": "Qual è il metodo di autenticazione raccomandato per proteggere un'APIRule in produzione destinata a essere consumata da SAP Launchpad Service o portali partner autorizzati?", "options": ["noop (nessuna autenticazione per massimizzare la velocità)", "jwt (JSON Web Token) configurato per verificare le chiavi pubbliche dell'istanza XSUAA/IAS di BTP", "Inserimento di una password in chiaro all'interno dell'URL della richiesta GET", "Controllo manuale dell'indirizzo MAC di ogni singolo computer richiedente"], "correctIndex": 1, "explanation": "La policy 'jwt' sull'APIRule delega a Istio la validazione crittografica del token Bearer inviato dal client contro i metadati JWKS di XSUAA. Questo blocca qualsiasi richiesta non autenticata prima ancora che raggiunga il pod del microservizio."}, {"id": 7, "question": "In che modo l'Horizontal Pod Autoscaler (HPA) garantisce la scalabilità elastica dei microservizi di Samaritan in caso di improvvisa impennata di richieste?", "options": ["Spegne gli altri computer dell'ufficio per dare più energia al cluster.", "Monitora parametri di carico (es. utilizzo medio della CPU o metriche personalizzate) e incrementa dinamicamente il numero di repliche dei Pod all'interno del Deployment K8s entro i limiti definiti (min/max), riducendole automaticamente al cessare del picco.", "Invia un'email di allarme all'amministratore delegato chiedendo l'acquisto immediato di nuove licenze.", "Converte automaticamente il codice sorgente da Python a C++ a runtime."], "correctIndex": 1, "explanation": "L'HPA monitora continuamente le metriche del workload: quando la soglia prefissata (es. 70% CPU) viene superata, istanzia istantaneamente nuovi pod gemelli per distribuire il carico; quando il traffico diminuisce, distrugge i pod eccedenti per risparmiare risorse."}, {"id": 8, "question": "Come si interfaccia un'applicazione frontend ospitata su 'SAP Launchpad Service' con i microservizi distribuiti su SAP BTP, Kyma runtime?", "options": ["Richiede di collegare i computer degli utenti fisicamente con un cavo ethernet al server Kyma.", "Viene configurata una Destination nel BTP Destination Service con tipo di autenticazione OAuth2 (Client Credentials o User Propagation) puntando all'hostname pubblico dell'APIRule esposta da Kyma.", "L'app Fiori scarica il codice sorgente del microservizio ed esegue il backend all'interno del browser dell'utente.", "Non è possibile integrare applicazioni Fiori con Kyma runtime in nessun caso."], "correctIndex": 1, "explanation": "L'integrazione segue lo standard di decoupling di BTP: l'APIRule espone l'endpoint sicuro, e il SAP Launchpad Service lo consuma tramite una BTP Destination protetta da OAuth 2.0, assicurando crittografia end-to-end e governance centralizzata."}, {"id": 9, "question": "Quale funzione svolgono le 'Kyma Serverless Functions' nell'architettura a microservizi di Samaritan?", "options": ["Sostituiscono completamente il sistema operativo Kubernetes con Windows Server.", "Permettono di eseguire porzioni di logica snella (es. in Node.js o Python) scatenate da eventi specifici di SAP Event Mesh (es. notifica di carenza scorte ospedaliere), senza dover manutenere un intero server o container sempre attivo.", "Servono a stampare documenti fiscali su stampanti ad aghi.", "Eliminano la necessità di scrivere codice nei progetti software."], "correctIndex": 1, "explanation": "Le Kyma Serverless Functions consentono un'architettura event-driven efficiente: il codice viene invocato istantaneamente solo quando si verifica un evento (es. ricezione di un messaggio da Event Mesh), scalando automaticamente e consumando risorse minime."}, {"id": 10, "question": "Nel contesto del ciclo di vita DevOps su Kyma, qual è il vantaggio di utilizzare 'SAP Continuous Integration and Delivery' rispetto al deployment manuale tramite 'kubectl' da riga di comando locale?", "options": ["SAP CI/CD impedisce agli sviluppatori di commettere errori di sintassi nei linguaggi di programmazione.", "Garantisce che ogni modifica al repository Git venga validata da test automatizzati, che l'immagine Docker venga tracciata e firmata in un registry sicuro, e che il rollout con Helm avvenga in modo controllato, auditabile e privo di downtime.", "SAP CI/CD scrive autonomamente il codice dell'applicazione al posto dello sviluppatore.", "Elimina l'obbligo di configurare certificati SSL e protocolli HTTPS."], "correctIndex": 1, "explanation": "La Continuous Delivery industrializza il processo: evita che singoli sviluppatori applichino configurazioni non tracciate direttamente da laptop locali, garantendo verifiche di sicurezza, tracciabilità dei commit e aggiornamenti rolling sicuri in produzione."}]}];
        let activeId = 1;
        let answers = {};

        try {
            const saved = localStorage.getItem('btp_minimal_answers');
            if (saved) answers = JSON.parse(saved);
        } catch(e) {}

        function init() {
            const savedTheme = localStorage.getItem('abap-wiki-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            const btn = document.querySelector('.theme-toggle-btn');
            if (btn) btn.textContent = savedTheme === 'dark' ? 'Tema: Dark' : 'Tema: Light';
            renderNav();
            loadChapter(activeId);
            updateStats();
        }

        function renderNav(filter = '') {
            const nav = document.getElementById('sidebar-nav');
            nav.innerHTML = '';

            const groups = [
                { title: 'Parte I: Overview & Architettura', list: CHAPTERS.filter(c => c.id <= 3) },
                { title: 'Parte II: Concetti Chiave & Servizi', list: CHAPTERS.filter(c => c.id >= 4 && c.id <= 11) },
                { title: 'Parte III: Casi d\'Uso Reali', list: CHAPTERS.filter(c => c.id >= 12) }
            ];

            groups.forEach(g => {
                const filtered = g.list.filter(c => 
                    c.title.toLowerCase().includes(filter.toLowerCase()) || 
                    c.number.toString().includes(filter)
                );
                if (filtered.length === 0) return;

                const t = document.createElement('div');
                t.className = 'nav-group-title';
                t.textContent = g.title;
                nav.appendChild(t);

                filtered.forEach(c => {
                    const item = document.createElement('div');
                    item.className = 'nav-item' + (c.id === activeId ? ' active' : '');
                    item.onclick = () => loadChapter(c.id);

                    const st = getStatus(c.id);

                    item.innerHTML = `
                        <div style="display:flex; align-items:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                            <span class="nav-item-num">${c.number}</span>
                            <span style="overflow:hidden; text-overflow:ellipsis;">${c.shortTitle}</span>
                        </div>
                        <span class="nav-dot ${st}"></span>
                    `;
                    nav.appendChild(item);
                });
            });
        }

        function getStatus(id) {
            const ch = CHAPTERS.find(c => c.id === id);
            if (!ch) return '';
            let count = 0;
            ch.quiz.forEach(q => {
                if (answers[`${id}_${q.id}`] !== undefined) count++;
            });
            if (count === ch.quiz.length) return 'done';
            if (count > 0) return 'in-prog';
            return '';
        }

        function onFilter(val) {
            renderNav(val);
        }

        function loadChapter(id) {
            const ch = CHAPTERS.find(c => c.id === id);
            if (!ch) return;
            activeId = id;

            renderNav();

            const area = document.getElementById('doc-render-area');

            // Quick Nav Strip
            const navStrip = `
            <div class="doc-nav-strip">
                <a class="doc-nav-link" href="#s-summary">Sintesi</a>
                ${ch.figures && ch.figures.length > 0 ? '<a class="doc-nav-link" href="#s-figures">Figure (' + ch.figures.length + ')</a>' : ''}
                ${ch.architectureDiagram ? '<a class="doc-nav-link" href="#s-blueprint">Architettura</a>' : ''}
                <a class="doc-nav-link" href="#s-topics">Argomenti Chiave (6)</a>
                <a class="doc-nav-link" href="#s-glossary">Glossario</a>
                <a class="doc-nav-link" href="#s-bp">Best Practice</a>
                <a class="doc-nav-link" href="#s-quiz">Quiz (${ch.quiz.length})</a>
            </div>
            `;

            // Figures Grid
            let figHtml = '';
            if (ch.figures && ch.figures.length > 0) {
                figHtml = `
                <h2 class="doc-section-h2" id="s-figures">Figure e Schemi Ufficiali</h2>
                <div class="doc-figures-grid">
                    ${ch.figures.map(f => `
                        <div class="doc-figure" onclick="openLightbox('${f.image}', '${escapeStr(f.title)}', '${escapeStr(f.explanation)}')">
                            <div class="doc-fig-img">
                                <img src="${f.image}" alt="${f.title}" loading="lazy">
                            </div>
                            <div class="doc-fig-caption">
                                <span class="doc-fig-label">${f.figNumber}</span>
                                <div class="doc-fig-title">${f.title}</div>
                                <div class="doc-fig-desc">${f.explanation}</div>
                            </div>
                        </div>
                    `).join('')}
                </div>
                `;
            }

            // Blueprint
            let bpDiagramHtml = '';
            if (ch.architectureDiagram) {
                bpDiagramHtml = `
                <h2 class="doc-section-h2" id="s-blueprint">Topologia & Blueprint Architetturale</h2>
                <pre class="doc-blueprint-box">${escapeHtml(ch.architectureDiagram)}</pre>
                `;
            }

            // Topics
            const topicsHtml = `
            <h2 class="doc-section-h2" id="s-topics">Argomenti di Approfondimento</h2>
            ${ch.coreTopics.map((t, idx) => `
                <div style="margin-bottom: 28px;">
                    <h3 class="doc-topic-h3">${t.title}</h3>
                    <div>${t.cleanHtml}</div>
                </div>
            `).join('')}
            `;

            // Glossary
            const glossaryHtml = `
            <h2 class="doc-section-h2" id="s-glossary">Glossario & Definizioni Essenziali</h2>
            <div class="doc-glossary">
                ${ch.keyDefinitions.map(d => `
                    <div class="doc-glossary-item">
                        <div class="doc-glossary-term">${d.term}</div>
                        <div class="doc-glossary-def">${d.definition}</div>
                    </div>
                `).join('')}
            </div>
            `;

            // Best Practices
            const bpHtml = `
            <h2 class="doc-section-h2" id="s-bp">Regole d'Oro di Cantiere (Best Practice)</h2>
            <div style="margin-bottom: 36px;">
                ${ch.workplaceBestPractices.map(b => `
                    <div class="doc-bp-item">
                        <span class="doc-bp-badge badge-${b.riskLevel.toLowerCase()}">${b.riskLevel}</span>
                        <div>
                            <div class="doc-bp-rule">${b.rule}</div>
                            <div class="doc-bp-reason">${b.reason}</div>
                        </div>
                    </div>
                `).join('')}
            </div>
            `;

            // Quiz
            const quizHtml = `
            <h2 class="doc-section-h2" id="s-quiz">Quiz di Verifica & Certificazione (${ch.quiz.length} Domande)</h2>
            <div class="doc-quiz-block">
                ${ch.quiz.map((q, idx) => {
                    const userAns = answers[`${id}_${q.id}`];
                    const answered = userAns !== undefined;
                    const letters = ['A', 'B', 'C', 'D'];

                    return `
                    <div class="doc-quiz-item" id="q-${id}-${q.id}">
                        <div class="doc-quiz-num">Domanda ${idx + 1} di ${ch.quiz.length}</div>
                        <div class="doc-quiz-q">${q.question}</div>
                        <div class="doc-quiz-opts">
                            ${q.options.map((opt, optIdx) => {
                                let cls = 'doc-quiz-btn';
                                if (answered) {
                                    if (optIdx === q.correctIndex) cls += ' correct';
                                    else if (optIdx === userAns) cls += ' wrong';
                                }
                                return `
                                <button class="${cls}" ${answered ? 'disabled' : ''} onclick="answerQuestion(${id}, ${q.id}, ${optIdx}, ${q.correctIndex})">
                                    <span class="doc-quiz-letter">${letters[optIdx]}</span>
                                    <span>${opt}</span>
                                </button>
                                `;
                            }).join('')}
                        </div>
                        <div class="doc-quiz-exp ${answered ? 'show' : ''}" id="exp-${id}-${q.id}">
                            <strong>Spiegazione Tecnica:</strong> ${q.explanation}
                        </div>
                    </div>
                    `;
                }).join('')}
            </div>
            <div class="doc-quiz-footer">
                <button class="doc-btn-subtle" onclick="resetQuiz(${id})">Ripeti Quiz</button>
                ${id < CHAPTERS.length ? `<button class="doc-btn" onclick="loadChapter(${id + 1})">Capitolo Successivo &rarr;</button>` : ''}
            </div>
            `;

            // Full Assemble
            area.innerHTML = `
                <div class="doc-header">
                    <div class="doc-part">${ch.part}</div>
                    <h1 class="doc-title">Capitolo ${ch.number}: ${ch.title}</h1>
                    <div class="doc-meta">
                        <span>Tempo: ${ch.readingTime}</span>
                        <span>Ruoli: ${ch.roles.join(', ')}</span>
                    </div>
                </div>

                ${navStrip}

                <div id="s-summary">
                    <h2 class="doc-section-h2" style="margin-top:0;">Sintesi Esecutiva</h2>
                    <div>${ch.cleanSummaryHtml}</div>
                </div>

                ${figHtml}
                ${bpDiagramHtml}
                ${topicsHtml}
                ${glossaryHtml}
                ${bpHtml}
                ${quizHtml}
            `;

            document.querySelector('.reading-scroll').scrollTop = 0;
            updateStats();
        }

        function answerQuestion(chId, qId, chosen, correct) {
            answers[`${chId}_${qId}`] = chosen;
            try {
                localStorage.setItem('btp_minimal_answers', JSON.stringify(answers));
            } catch(e) {}

            const item = document.getElementById(`q-${chId}-${qId}`);
            if (item) {
                const btns = item.querySelectorAll('.doc-quiz-btn');
                btns.forEach((btn, idx) => {
                    btn.disabled = true;
                    if (idx === correct) btn.classList.add('correct');
                    else if (idx === chosen) btn.classList.add('wrong');
                });
                const exp = document.getElementById(`exp-${chId}-${qId}`);
                if (exp) exp.classList.add('show');
            }
            renderNav();
            updateStats();
        }

        function resetQuiz(chId) {
            const ch = CHAPTERS.find(c => c.id === chId);
            if (!ch) return;
            ch.quiz.forEach(q => delete answers[`${chId}_${q.id}`]);
            try {
                localStorage.setItem('btp_minimal_answers', JSON.stringify(answers));
            } catch(e) {}
            loadChapter(chId);
        }

        function updateStats() {
            let total = 0;
            let count = 0;
            CHAPTERS.forEach(c => {
                c.quiz.forEach(q => {
                    total++;
                    if (answers[`${c.id}_${q.id}`] !== undefined) count++;
                });
            });
            const done = CHAPTERS.filter(c => getStatus(c.id) === 'done').length;
            const el = document.getElementById('stat-progress');
            if (el) el.textContent = `${done}/18 completati`;
        }

        function openLightbox(src, title, desc) {
            document.getElementById('lb-img').src = src;
            document.getElementById('lb-title').textContent = title;
            document.getElementById('lb-desc').textContent = desc;
            document.getElementById('lightbox').classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }

        function toggleTheme() {
            const cur = document.documentElement.getAttribute('data-theme') || 'dark';
            const nxt = cur === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', nxt);
            localStorage.setItem('abap-wiki-theme', nxt);
            const btn = document.querySelector('.theme-toggle-btn');
            if (btn) btn.textContent = nxt === 'dark' ? 'Tema: Dark' : 'Tema: Light';
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function escapeStr(str) {
            if (!str) return '';
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        window.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeLightbox();
        });

        window.onload = init;
    </script>
</body>
</html>
